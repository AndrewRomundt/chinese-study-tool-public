<script>
(() => {

const DAY = 864e5;

/* ---------------- Progress store (synced via db, mirrored locally) ---------------- */
const LS_KEY = "zitie-progress-v1";

function rec(id) { return P.w[id] || null; }

/* ---------------- Flagged words ---------------- */
// keyed by the characters, so a word the course repeats in two lessons is one flag
const isFlagged = w => !!P.flag[w.t];

function lessonIndex(l) { return LESSONS.indexOf(l); }
function buildPool(lesson) {
  const li = lessonIndex(lesson);
  const seen = new Set();
  let ws;
  if (setup.scope === "this") ws = byLesson[lesson].slice();
  else ws = WORDS.filter(w => lessonIndex(w.l) <= li);
  if (setup.scope === "weak") ws = ws.filter(w => !mastered(w.id));
  // the course repeats some words across lessons; keep the first copy of each character string
  return ws.filter(w => !seen.has(w.t) && seen.add(w.t));
}
// grammar patterns such as 太……了 make no sense read aloud, so dictation leaves them out
const dictable = w => !w.d.includes("…");
// words whose pinyin (tones included) matches a different course word, e.g. 他 / 她 / 它
const soundKey = w => w.p.toLowerCase().replace(/[\s'’·-]/g, "");
// ...and words that only sound alike: a neutral tone is too light to tell from a full one (吗/骂, 眼睛/眼镜),
// and tones change as spoken (3-3 says 2-3; 一 and 不 change before other tones)
const bareSy = w => w.sy.map(s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()).join(" ");
function spoken(w) {
  const t = w.tn.slice(), s = bareSy(w).split(" ");
  for (let i = 0; i < t.length - 1; i++) {
    if (t[i] === 3 && t[i + 1] === 3) t[i] = 2;
    else if (s[i] === "yi" && t[i] === 1) t[i] = t[i + 1] === 4 ? 2 : 4;
    else if (s[i] === "bu" && t[i] === 4 && t[i + 1] === 4) t[i] = 2;
  }
  return t;
}
const alike = (a, b) => a.length === b.length && a.every((t, i) => t === b[i] || t === 5 || b[i] === 5);
let SOUNDS = null, SYLS = null;
function homophone(w) {
  if (!SOUNDS) {
    SOUNDS = {}; SYLS = {};
    WORDS.forEach(o => {
      (SOUNDS[soundKey(o)] = SOUNDS[soundKey(o)] || new Set()).add(o.t);
      if (o.tn && o.sy) (SYLS[bareSy(o)] = SYLS[bareSy(o)] || []).push(o);
    });
  }
  if (SOUNDS[soundKey(w)].size > 1) return true;
  return !!(w.tn && w.sy) && SYLS[bareSy(w)].some(o => o.t !== w.t && alike(spoken(w), spoken(o)));
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------------- Marking (stroke matching adapted from Hanzi Writer's quiz) ----------------
   Strokes are compared in the character's 1024-unit space against the stroke medians. */
const Mark = (() => {
  const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
  const mag = p => Math.hypot(p.x, p.y);
  const dist = (a, b) => mag(sub(a, b));
  const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
  const last = a => a[a.length - 1];
  const len = pts => pts.slice(1).reduce((acc, p, i) => acc + dist(p, pts[i]), 0);

  const boxHtml = k => `
      <div class="col" style="width:${size}px">
        <div class="box" style="width:${size}px" data-k="${k}">${gridSvg()}<div class="hw" id="hw${k}"></div><canvas class="ink" width="${size}" height="${size}" role="img" aria-label="Writing box ${k + 1}"></canvas></div>
        <div class="model" hidden><div class="mw" id="mw${k}"></div><span class="mnote"></span></div>

  <div class="practice">

      if (stroke.length === 1) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(stroke[0].x, stroke[0].y, stroke[0].w / 2, 0, 7); ctx.fill(); }

  };

  const container = $("#boxes");
  const block = e => { if (e.target.closest && e.target.closest(".box") && e.cancelable) e.preventDefault(); };
  ["touchstart", "touchmove"].forEach(t => container.addEventListener(t, block, { passive: false }));
  let active = null;
  const lastTap = { k: -1, t: 0 };
  const ptIn = (e, cv) => { const r = cv.getBoundingClientRect(), f = size / r.width; return { x: (e.clientX - r.left) * f, y: (e.clientY - r.top) * f, w: widthFor(e) }; };
  container.addEventListener("pointerdown", e => {
    if (st.done) return;
    if (e.pointerType === "pen" && !P.settings.sawPencil) { P.settings.sawPencil = true; save(); }
    const box = e.target.closest(".box"); if (!box) return;

      const k = +box.dataset.k, now = Date.now();

    $("#fb").textContent = "";
  });
  container.addEventListener("pointermove", e => {
    if (!active || e.pointerId !== active.id) return;
    e.preventDefault();

      const p = ptIn(ev, active.cv), prev = active.stroke[active.stroke.length - 1];
      if (Math.abs(p.x - prev.x) + Math.abs(p.y - prev.y) < 0.8) continue;
      p.w = prev.w * 0.6 + p.w * 0.4; // smooth width changes

  const end = e => {
    if (!active || e.pointerId !== active.id) return;
    if (tr && active.k === boxes.length - 1) setCount(boxes.length + 1); // writing in the last box opens the next one

  };
  container.addEventListener("pointerup", end);
  container.addEventListener("pointercancel", end);

  $("#undoBtn").onclick = () => { if (st.done || !st.order.length) return; const k = st.order.pop(); st.ink[k].pop(); redraw(k); };
  // Clear empties the box written in most recently; a finger double-tap empties the tapped box
  const clearBox = k => { if (st.done || k == null || k < 0) return; st.ink[k].length = 0; st.order = st.order.filter(x => x !== k); redraw(k); };
  st.clearBox = clearBox;
  $("#clearBtn").onclick = () => clearBox(st.order[st.order.length - 1]);
  $("#hintBtn").onclick = () => {
    if (st.done) return;
    st.hints++;
    st.writers.forEach(wr => wr.showOutline());
    if (!tracing) setTimeout(() => st.writers.forEach(wr => wr.hideOutline()), 1200);
  };
  // the accepted answers that fit this many boxes; in translation 你 and 您 count as the same,
  // except when the note asks for polite speech, and 你们 never becomes 您们
  const swap = tr && !/polite/.test(w.note || "");
  const answersFor = m => [...new Set([w.t, ...(w.alts || [])].filter(a => [...a].length === m)
    .flatMap(a => swap ? [a, a.replace(/您/g, "你"), a.replace(/你(?!们)/g, "您")] : [a]))];
  const toChar = p => { const scale = (size - 2 * pad) / 1024; return { x: (p.x - pad) / scale, y: (size - 124 * scale - pad - p.y) / scale }; };
  // marks the ink against every accepted answer and keeps the one it matches best;
  // answers share most characters, so each box is marked once per distinct character (99 calls → 13 at worst)
  const markInk = () => {
    const mode = markingMode(), ink = st.ink.map(strokes => strokes.map(stroke => stroke.map(toChar))), seen = new Map();
    // an empty box is simply "not written", so the stroke matcher never sees an empty attempt
    const markBox = (k, c) => seen.get(k + c) || seen.set(k + c, ink[k].length ? Mark.character(ink[k], STROKES[c], mode, size) : { marks: [], good: 0, expected: STROKES[c].medians.length, drawn: 0, correct: false }).get(k + c);
    let best = null;
    for (const a of answersFor(st.ink.length)) {
      const marks = [...a].map((c, k) => markBox(k, c)), good = marks.reduce((x, m) => x + m.good, 0);
      if (!best || good > best.good) best = { a, marks, good };
    }
    st.answer = best.a; st.marks = best.marks;
  };
  const noFit = () => tr && !answersFor(boxes.length).length;
  // empty boxes after the last one written in don't count (they're dropped, keeping at least one)
  const trim = () => { let u = st.ink.length; while (u > 1 && !st.ink[u - 1].length) u--; setCount(u); };
  // seeing the pinyin counts as a hint, like the outline
  if (dict || tr) $("#pyBtn").onclick = () => {
    if (st.done || !$("#py").hidden) return;
    st.hints++; $("#py").hidden = false; $("#pyBtn").disabled = true;
  };
  $("#revealBtn").onclick = () => {
    if (st.done) return;
    if (tr) { trim(); if (noFit() || !st.order.length) setCount([...w.t].length); } // nothing that fits: show the main answer in its own number of boxes
    st.revealed = true; check(true);
  };
  $("#checkBtn").onclick = () => {
    if (st.done) return;
    if (tr) trim();
    const m = st.ink.length;
    // Write and 听写 can be checked with some boxes empty (a half-remembered word is still worth marking);
    // a translation needs every box it is checked with
    const empty = st.ink.findIndex(a => !a.length);
    if (empty >= 0 && (tr || st.ink.every(a => !a.length))) {
      $("#fb").innerHTML = `<span class="pill warn">${m > 1 && tr ? `Box ${empty + 1} is still empty` : "Write something first"}</span>`;
      return;
    }
    if (noFit()) { $("#fb").innerHTML = `<span class="pill warn">No accepted answer has ${m} character${m === 1 ? "" : "s"}. Check the number of boxes.</span>`; return; }
    check(false);
  };

  function check(revealed) {
    st.done = true;
    markInk();
    canvases.forEach((_, k) => redraw(k));
    // the boxes show the same accepted answer as the reference row below (in translation it can differ from the main one)
    if (revealed) canvases.forEach(cv => { cv.style.opacity = ".3"; }); // your strokes fade so the shown answer reads clearly
    if (revealed) [...st.answer].forEach((c, k) => {
      const wr = st.writers[k];
      if (!wr) st.writers[k] = writerFor(k, c, true);
      else if (c === [...w.t][k]) wr.showCharacter();
      else wr.setCharacter(c).then(() => wr.showCharacter());
    });
    if (dict || tr) $("#py").hidden = false;
    if (dict) $("#hint").hidden = false;
    const allCorrect = st.marks.every(m => m.correct);
    const strokesOk = st.marks.reduce((a, m) => a + m.good, 0), strokesExp = st.marks.reduce((a, m) => a + Math.max(m.expected, m.drawn), 0);
    let result;
    if (revealed) result = "miss";
    else if (allCorrect && !st.hints) result = "good";

    else result = "miss";
    const graded = !tracing && !drill && !again, store = tr ? P.tr : P.w;
    const before = graded && store[w.id] ? { ...store[w.id] } : null; // kept so "It was right" can undo this grade
    const record = r => {
      if (tr) { const x = P.tr[w.id] = P.tr[w.id] || { n: 0, c: 0 }; x.n++; if (r !== "miss") x.c++; x.last = Date.now(); }
      else grade(w.id, r);
    };
    const res = { w, result, hints: st.hints, revealed, bad: strokesExp - strokesOk };
    // your own writing, with its stroke marks, for the copybook page at the end of the round
    const snap = () => { res.ink = st.ink.some(a => a.length) ? canvases.map(cv => cv.toDataURL()) : null; };
    snap();

    const ms = size >= 200 ? 88 : 64;
    $("#boxes").style.setProperty("--mw", ms + "px");
    const tells = []; // the stroke fixes, so the verdict in the dock can name them too
    boxes.forEach((b, k) => {
      const m = st.marks[k], col = b.parentElement, note = col.querySelector(".mnote");
      if (!revealed) b.classList.add(m.correct ? "done" : "wrongbox"); // a shown answer is a study aid, not a mistake
      col.querySelector(".model").hidden = revealed; // a shown answer is already in the boxes; no second copy underneath
      st.modelFor = (k, ms) => { $("#mw" + k).innerHTML = ""; st.models[k] = HanziWriter.create("mw" + k, [...st.answer][k], { width: ms, height: ms, padding: 3, strokeColor: C.ink, renderer: "svg", charDataLoader: loader, strokeAnimationSpeed: 1.4, delayBetweenStrokes: 150 }); };
      st.modelFor(k, ms); st.ms = ms;
      const msgs = [];
      if (m.correct) msgs.push("All strokes right");
      else {
        if (m.drawn !== m.expected) msgs.push(`${m.drawn} stroke${m.drawn === 1 ? "" : "s"}, should be ${m.expected}`);
        // each coloured stroke by the order you wrote it, with what to change
        const fixes = m.marks.map((x, i) => ({ x, i, t: x === "order" ? "out of order" : x === "backwards" ? "written backwards" : x === "wrong" ? m.why[i] : "" })).filter(f => f.t);
        if (fixes.length > 4) msgs.push(`${fixes.length} strokes are red or amber`); // a different character: a list would just be noise
        else fixes.forEach(f => msgs.push(`${ordinal(f.i + 1)} stroke: ${f.t}`));

        if (m.drawn) tells.push(...msgs.map(t => boxes.length > 1 ? `${[...st.answer][k]} ${t}` : t));
      }
      note.textContent = revealed ? "" : m.drawn ? msgs.join("; ") : "Not written"; // a shown answer is for studying, so the attempt is not graded
      // a box far from the character (a word not known yet) gets a quiet note; red is for a real attempt that went wrong
      note.className = "mnote " + (m.correct ? "good" : Math.abs(m.drawn - m.expected) > 2 ? "" : "bad");
    });

    // a short list of fixes replaces "check the strokes"; a long one stays under the boxes
    const tell = tells.length && tells.length <= 2 ? tells.join("; ") : "";
    const label = tracing ? (allCorrect ? "Traced correctly" : "Check the coloured strokes, then try from memory") : revealed ? "Answer shown" : again ? (allCorrect ? "Correct this time" : tell ? "Still red: " + tell : "Still some red strokes") : drill ? (allCorrect ? "Correct" : tell ? "Not quite: " + tell : "Not quite, check the coloured strokes") : { good: "Correct", close: allCorrect ? `Correct, with ${st.hints} hint${st.hints === 1 ? "" : "s"}` : tell ? "Nearly: " + tell : "Nearly, check the red strokes", miss: "Not quite, this one comes back soon" }[result];
    const cls = revealed ? "shown" : { good: "good", close: "warn", miss: "bad" }[result];

    // the verdict and its overrule ride in the bottom dock with Next, so they're on screen however tall the card is;
    // the longer notes (other accepted answers, the colour key) sit under the boxes
    $("#fb").innerHTML = `<div class="verdict"><span class="pill ${cls}${tr || tell ? " long" : ""}"><span class="han">${esc(shown)}</span>${esc(label)}</span>` +
      (graded && !allCorrect && !revealed ? `<button class="btn small" id="overrideBtn" type="button">It was right</button>` : "") + `</div>`;
    $("#fbx").innerHTML = (others.length ? `<p class="note legend">Also accepted: <span class="han-inline">${others.map(esc).join("　")}</span></p>` : "") +
      (!st.marks.some(m => m.marks.some(x => x === "order" || x === "backwards")) ? "" /* the key is for amber; red speaks for itself */ : `<p class="note legend key"><b class="lg-warn">Amber</b> strokes are out of order or backwards. <b class="lg-bad">Red</b> strokes are the wrong shape or in the wrong place.</p>`);

    $("#ctl").classList.add("after"); // still pinned, so Next stays on screen however tall the marked card is
    $("#ctl").innerHTML = `
      <button class="btn" id="animBtn" type="button">Stroke order</button>
      ${dict ? "" : `<button class="btn" id="hearBtn2" type="button">Hear it</button>`}
      ${drill ? `<button class="btn" id="drillNext" type="button">${s.i + 1 < s.words.length ? "Next word" : "Finish"}</button>` : `<button class="btn" id="againBtn" type="button">Write again</button>`}
      <button class="btn primary" id="nextBtn" type="button">${nextLabel}</button>`;
    if ($("#hearBtn2")) $("#hearBtn2").onclick = say; // 听写 keeps its own Play again above
    // the marker can be wrong about good handwriting: put the record back as it was, then grade it as right
    // once overruled the strokes go back to plain ink and the notes clear; Undo puts the marker's verdict back
    if ($("#overrideBtn")) {
      const marked = { rec: store[w.id] ? { ...store[w.id] } : null, res: { ...res }, marks: st.marks, pill: $("#fb .pill").outerHTML };
      const notes = boxes.map(b => b.parentElement.querySelector(".mnote"));
      const noteWas = notes.map(x => [x.textContent, x.className]);
      const overrule = () => {
        if (before) store[w.id] = { ...before }; else delete store[w.id];
        Object.assign(res, { result: st.hints ? "close" : "good", bad: 0, overridden: true });
        record(res.result); save();
        st.marks = null; canvases.forEach((_, k) => redraw(k)); snap();
        boxes.forEach(b => { b.classList.remove("wrongbox"); b.classList.add("done"); });
        notes.forEach(x => { x.textContent = ""; });
        $("#fb .pill").outerHTML = `<span class="pill good"><span class="han">${esc(shown)}</span>Marked correct by you</span>`;
        if ($("#fbx .key")) $("#fbx .key").hidden = true;
        $("#overrideBtn").textContent = "Undo"; $("#overrideBtn").onclick = undo;
      };
      const undo = () => {
        if (marked.rec) store[w.id] = { ...marked.rec }; else delete store[w.id];
        for (const k in res) delete res[k];
        Object.assign(res, marked.res); save();
        st.marks = marked.marks; canvases.forEach((_, k) => redraw(k)); snap();
        boxes.forEach((b, k) => { b.classList.remove("done"); b.classList.add(st.marks[k].correct ? "done" : "wrongbox"); });
        notes.forEach((x, k) => { [x.textContent, x.className] = noteWas[k]; });
        $("#fb .pill").outerHTML = marked.pill;
        if ($("#fbx .key")) $("#fbx .key").hidden = false;
        $("#overrideBtn").textContent = "It was right"; $("#overrideBtn").onclick = overrule;
      };
      $("#overrideBtn").onclick = overrule;
    }
    if (drill) $("#drillNext").onclick = () => { s.reps = 0; s.i++; if (s.i < s.words.length) renderCard(); else renderPicker(s.lesson); };
    // plays in the small model under each box, or in the box itself where the answer was shown there
    $("#animBtn").onclick = async () => { for (const [k, m] of st.models.entries()) await (boxes[k].parentElement.querySelector(".model").hidden && st.writers[k] ? st.writers[k] : m).animateCharacter(); };
    if (!drill) $("#againBtn").onclick = () => practiseAgain();
    $("#nextBtn").onclick = goNext;
    $("#nextBtn").focus({ preventScroll: true });
    const model0 = boxes[0].parentElement.querySelector(".model"); // the first stroke note clears the dock, however tall the dock is
    // the notes under the boxes (other accepted answers, the colour key) come into view too when there are any
    const clear = $("#fbx").textContent ? $("#fbx") : model0;
    clear.style.scrollMarginBottom = $("#dock").offsetHeight + 16 + "px"; clear.scrollIntoView({ block: "nearest" });
  }

  // extra practice on the same word: a fresh card with the answer hidden again; the first attempt's grade stands
  function practiseAgain() { s.again = true; renderCard(); }
}

/* ---------------- Translation (exercises/translation.json) ---------------- */
let TRANS = {}, trCount = 10;
const hanOnly = s => [...s].filter(c => /[一-鿿]/.test(c)).join("");
// equally good wordings the data doesn't list; each rule is applied to everything the earlier rules made
const PRON = "(我们|你们|他们|她们|我|你|您|他|她)", PLURAL = "(我们|你们|他们|她们)";
const TIME = "((?:今天|明天|昨天|现在|晚上|下午|上午|早上|白天|今年|去年|平时|刚才|星期六|以前|有的时候|常常)+)";
const PEOPLE = "(爸爸|妈妈|太太|孩子|父母亲|老师|朋友|同学|家|老板|家乡|老家|房东|经理)", PLACES = "(大学|学校|公司|系)";
const WORDING_RULES = [
  zh => [zh.replace(/(号码|电话)是什么/g, "$1是多少"), zh.replace(/(号码|电话)是多少/g, "$1是什么")],
  // 很 before an adjective is optional unless the English asks for "very" (then 非常 works too); 很多 and 很少 keep it
  (zh, en) => /\b(very|really|quite)\b/i.test(en) ? [zh.replace(/很/g, "非常"), zh.replace(/非常/g, "很")] : [zh.replace(/很(?![多少])/g, "")],
  // 儿 is optional, and 哪儿/这儿/那儿 have 里 forms
  zh => [zh.replace(/一点儿/g, "一点"), zh.replace(/哪儿/g, "哪里"), zh.replace(/这儿/g, "这里"), zh.replace(/那儿/g, "那里"), zh.replace(/(玩|空|事|花)儿/g, "$1")],
  zh => [zh.replace(/有点儿/g, "有一点儿"), zh.replace(/有点儿/g, "有点")],
  // a time phrase can come before or after the subject
  zh => [zh.replace(new RegExp(`(^|[，。？！])${PRON}${TIME}`, "g"), "$1$3$2"), zh.replace(new RegExp(`(^|[，。？！])${TIME}${PRON}`, "g"), "$1$3$2")],
  // 的 is optional before family, friends and home; before a school or company only after 我们/你们/他们
  zh => [zh.replace(new RegExp(PRON + "的" + PEOPLE, "g"), "$1$2"), zh.replace(new RegExp(PLURAL + "的" + PLACES, "g"), "$1$2"),
    zh.replace(new RegExp(PRON + "(?=" + PEOPLE + "|" + PLACES + ")", "g"), "$1的")],
  zh => ["但是", "可是", "不过"].flatMap(a => ["但是", "可是", "不过"].map(b => zh.replace(new RegExp(a, "g"), b))),
  zh => [zh.replace(/跟(.{1,4}?)一起/g, "和$1一起"), zh.replace(/和(.{1,4}?)一起/g, "跟$1一起")],
  // English "they" doesn't say men or women; English "you" doesn't say one person or several
  (zh, en) => /\b(they|them|their)\b/i.test(en) ? [zh.replace(/他们/g, "她们"), zh.replace(/她们/g, "他们")] : [],
  (zh, en, note) => /\b(you|your)\b/i.test(en) && !/\b(all|everyone|both|guys)\b/i.test(en) && !/polite/.test(note || "")
    ? [zh.replace(new RegExp("你们(?=" + PLACES + ")", "g"), "你的").replace(/你们/g, "你"), zh.replace(/你(?!们)/g, "你们")] : [],
];
function wordings(zh, en, note) {
  const set = new Set([zh]);
  for (const rule of WORDING_RULES) for (const a of [...set]) for (const v of rule(a, en, note)) if (set.size < 300) set.add(v);
  return [...set];
}
// shaped like a word so the Write card can use it: t = characters to write, h = the English prompt
const trItems = l => (TRANS[l] || []).map(it => {
  const t = hanOnly(it.zh);
  // a character without stroke data can't be marked, so wordings that need one are left out
  const alts = [...new Set([it.zh, ...(it.alt || [])].flatMap(a => wordings(a, it.en, it.note)).map(hanOnly))].filter(a => a && a !== t && [...a].every(c => STROKES[c]));
  return { id: it.id, l, d: it.zh, t, alts, altD: it.alt || [], p: it.py, h: it.en, note: it.note };
});
function renderTranslate(lesson) {
  route = "trsetup"; session = null;
  const items = trItems(lesson), right = it => P.tr[it.id] && P.tr[it.id].c > 0;
  main.innerHTML = `
  <div class="view">
    <div><h2>English to Chinese</h2><div class="sub">Translation (译)</div></div>
    <section class="sheet">
      <div class="field"><label for="trSel">Lesson</label><select id="trSel">${lessonOptions(lesson)}</select></div>
      <div class="field"><span class="lbl">How many</span><div class="seg" id="segTr">
        <button type="button" data-v="10">10</button><button type="button" data-v="25">25</button><button type="button" data-v="0">All</button>
      </div></div>
      <p class="note">${items.length} sentences in lesson ${esc(lesson)}, ${items.filter(right).length} you've already got right. Ones you haven't got right yet come first. Boxes are added as you write; − and + change the count if you need to.</p>
      <div class="settings-row"><button class="btn primary" id="trGo" type="button"${items.length ? "" : " disabled"}>Start</button><button class="btn" id="back" type="button">Back</button></div>
    </section>
  </div>`;
  const seg = $("#segTr"), paint = () => seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === trCount)));
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { trCount = +b.dataset.v; paint(); });
  paint();

  $("#back").onclick = () => go("home");
  $("#trGo").onclick = () => {
    const pool = shuffle(items).sort((a, b) => right(a) - right(b));

}

function finish() {
  const s = session;
  if (!s) return go("home");
  const res = s.results, good = res.filter(r => r.result === "good").length, close = res.filter(r => r.result === "close").length;
  const modeName = s.dict ? "Dictation" : s.tr ? "Translation" : "Write mode";
  if (res.length) { P.hist.push({ t: Date.now(), mode: s.dict ? "dictation" : s.tr ? "translation" : "write", label: s.label, n: res.length, good, close }); P.hist = P.hist.slice(-200); save(); }
  route = "summary";
  const missed = res.filter(r => r.result !== "good").map(r => r.w);
  main.innerHTML = `

function themeColors() {

function showCard() {

function rateCard(w, r) {
  const s = session;

/* Match game */
let matchSide = "english";
function startMatch(lesson) {

  if (rounds.length > 1 && rounds[rounds.length - 1].length < 3) rounds[rounds.length - 2].push(...rounds.pop());
  session = { kind: "match", lesson, rounds, r: 0, mistakes: 0, t0: Date.now(), wrongIds: new Set() };
  route = "match";
  showMatch();
}
function showMatch() {
  const s = session, round = s.rounds[s.r];

    </div>
  </div>`;
  $("#quit").onclick = () => matchDone(true);
  $("#segSide").querySelectorAll("button").forEach(b => b.onclick = () => { matchSide = b.dataset.v; showMatch(); });
  const tick = () => { const el = $("#clock"); if (!el || session !== s) return; el.textContent = fmtTime(Date.now() - s.t0); setTimeout(tick, 500); };
  tick();
  let pick = null, left_ = 0;
  const tiles = [...main.querySelectorAll(".tile")];
  tiles.forEach(t => t.onclick = () => {

      if (pick) pick.classList.remove("picked");
      pick = t; t.classList.add("picked");
      if (isLeft) speak(WORDS[+t.dataset.id].t);
      return;
    }
    const a = pick, b = t; pick = null; a.classList.remove("picked");
    if (a.dataset.id === b.dataset.id) {
      a.classList.add("gone"); b.classList.add("gone");
      if (++left_ === round.length) setTimeout(() => { s.r++; if (s.r < s.rounds.length) showMatch(); else matchDone(false); }, 350);

  const newBest = !early && (!prev || ms < prev);

  route = "summary";
  const wrong = [...s.wrongIds].map(id => WORDS[id]);
  main.innerHTML = `
  <div class="view">
    <div><h2>${early ? "Match game stopped" : "All matched"}</h2><div class="sub">Learn, lesson ${esc(s.lesson)}</div></div>
    <div class="score"><span class="big">${fmtTime(ms)}</span><span>${s.mistakes} mistake${s.mistakes === 1 ? "" : "s"}${newBest ? ", a new best time" : prev ? `, best ${fmtTime(prev)}` : ""}</span></div>
    ${wrong.length ? `<p class="note">Mixed up: <span class="han-inline">${uniqueWords(wrong).map(w => esc(w.d)).join("、")}</span></p>` : ""}

const textLesson = l => { const ls = textLessons(); return ls.includes(l) ? l : ls.filter(x => lessonIndex(x) <= lessonIndex(l)).pop() || ls[0]; };

function logHist(mode, label, n, good) { P.hist.push({ t: Date.now(), mode, label, n, good }); P.hist = P.hist.slice(-200); save(); }

let READS = {}; // lesson → dialogue and story from exercises/reading.json
// a lesson's passages: the dialogue and story from reading.json, then the short text from lessons.json
const passagesFor = l => [
  ...(READS[l] || []).map(p => ({ id: p.id, name: `${p.kind === "dialogue" ? "Dialogue" : "Story"}: ${p.title.zh}`, title: p.title, lines: p.lines, text: p.text,
    qs: p.questions.map(q => ({ zh: q.zh, py: q.py, en: q.en, opts: options([0, q.options]) })) })),
  ...(TEXTS[l] ? [{ id: l + "-short", name: "Short text", text: TEXTS[l].r[0], qs: TEXTS[l].r[1].map(q => ({ en: q[0], opts: options(q) })) }] : []),

// course words in a passage become tappable: longest match first against the vocabulary
let VOCAB = null;
function linkWords(zh) {
  if (!VOCAB) { VOCAB = new Map(); WORDS.forEach(w => { if (dictable(w) && !VOCAB.has(w.t)) VOCAB.set(w.t, w); }); }
  const cs = [...zh];
  let out = "", i = 0;
  while (i < cs.length) {
    let L = Math.min(6, cs.length - i);
    while (L > 0 && !VOCAB.has(cs.slice(i, i + L).join(""))) L--;
    if (L) { const t = cs.slice(i, i + L).join(""); out += `<span class="wd" data-id="${VOCAB.get(t).id}">${esc(t)}</span>`; i += L; }
    else out += esc(cs[i++]);
  }
  return out;
}

function startGrammarQuiz(lesson) {

  const items = shuffle([
    ...pts.flatMap(p => p[3].map(q => ({ kind: "gap", q: q[0], answer: q[1][0], opts: options(q), rule: [p[0], p[1]] }))),
    ...pts.flatMap(p => p[2].filter(([zh]) => zh.split("|")[0].split(" ").length > 2).map(([zh, en]) => {
      const orders = zh.split("|");
      return { kind: "order", words: orders[0].split(" "), accept: orders.map(o => o.replace(/ /g, "")), en, rule: [p[0], p[1]] };

    $(".practice .gq").textContent = sentence;
    $("#fb").innerHTML = ok ? `<span class="pill good">Right</span>`
      : `<span class="pill bad">${gap ? "Not quite" : `Not quite, you wrote <span class="han">${esc(mine)}</span>`}</span>` + /* a gap pick is already marked "yours" on its tile */
        `<p class="rule">${it.rule[1].includes(it.rule[0]) ? esc(it.rule[1]) : `<b>${esc(it.rule[0])}</b>: ${esc(it.rule[1])}`}</p>`;
    speak(sentence.replace(/^.*= /, ""));
    $("#ctl").innerHTML = `<button class="btn" id="gHear" type="button">Hear it</button><button class="btn primary" id="gNext" type="button">${s.i + 1 < s.items.length ? "Next" : "See results"}</button>`;
    $("#gHear").onclick = () => speak(sentence.replace(/^.*= /, ""));
    $("#gNext").onclick = () => { s.i++; showGrammarItem(); };
  };
}
function grammarDone() {
  const s = session; if (!s) return go("home");
  const n = s.right + s.missed;
  if (n) logHist("grammar", "Lesson " + s.lesson, n, s.right);
  route = "summary";
  main.innerHTML = `
  <div class="view">
    <div><h2>Quiz results</h2><div class="sub">Grammar, lesson ${esc(s.lesson)}</div></div>
    <div class="score"><span class="big">${s.right}/${n}</span><span>right</span></div>
    <div class="settings-row"><button class="btn primary" id="gAgain" type="button">Quiz again</button><button class="btn" id="gBack" type="button">Back to the grammar points</button></div>
  </div>`;
  $("#gAgain").onclick = () => startGrammarQuiz(s.lesson);
  $("#gBack").onclick = () => renderGrammar(s.lesson);
  session = null;
}

/* ---------------- Settings ---------------- */
function renderSettings() {
  const s = P.settings;
  main.innerHTML = `
  <div class="view">
    <div><h2>Writing and progress</h2><div class="sub">Settings</div></div>
    <section class="sheet">
      <div class="field"><span class="lbl">Writing input</span><div class="seg" id="segInput">
        <button type="button" data-v="auto">Automatic</button><button type="button" data-v="pencil">Apple Pencil only</button><button type="button" data-v="any">Pencil or finger</button>
      </div><p class="note">Automatic accepts your finger until you first write with Apple Pencil, then ignores fingers and your palm in the writing boxes. Once fingers are ignored, double-tap a box with your finger to clear it.${s.sawPencil ? " Apple Pencil has been detected." : ""}</p></div>
      <div class="field"><span class="lbl">Marking</span><div class="seg" id="segMark">
        <button type="button" data-v="standard">Standard</button><button type="button" data-v="lenient">Lenient</button><button type="button" data-v="free">Any stroke order</button>
      </div><p class="note">Your writing is marked when you tap Check. Standard checks stroke order and shape. Lenient accepts much looser stroke shapes. Neither minds if the character is big, small or off-centre in the box. Any stroke order checks only that every stroke is there, in the right shape and direction.</p></div>
      <div class="field"><span class="lbl">Audio</span><p class="note" id="voiceNote"></p><div><button class="btn" id="testVoice" type="button">Test voice: 你好，我叫王小明。</button></div></div>
      <div class="field"><span class="lbl">Keyboard</span><p class="note">With a keyboard attached, Enter checks your writing and then moves on, Esc closes a word card, and in flashcards Space flips the card and 1–4 rate it (Again, Hard, Good, Easy).</p></div>
      <div class="field"><span class="lbl">Progress</span><p class="note">${Object.keys(P.w).length} words practised, ${WORDS.filter(w => mastered(w.id)).length} mastered, ${flaggedWords().length} flagged. ${plural(Object.values(P.tr).filter(r => r.c).length, "translation sentence")} right, ${plural(Object.keys(P.rd).length, "reading passage")} done. ${dbRef ? "Progress syncs to every device where you open this page signed in to Claude." : "Progress is saved in this browser only right now."}</p>
        <div class="settings-row"><button class="btn" id="resetBtn" type="button">Reset all progress</button><span class="note" id="resetNote"></span></div></div>
      <div><button class="btn primary" id="done" type="button">Done</button></div>
    </section>
  </div>`;
  const seg = (id, key, cast) => {
    const el = $(id);
    const paint = () => el.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(cast(b.dataset.v) === s[key])));
    el.querySelectorAll("button").forEach(b => b.onclick = () => { s[key] = cast(b.dataset.v); save(); paint(); });
    paint();
  };
  seg("#segInput", "input", String);
  markingMode(); seg("#segMark", "marking", String);
  $("#voiceNote").textContent = zhVoice ? `Using the ${zhVoice.name} voice.` +
    (/premium|enhanced/i.test(zhVoice.name + zhVoice.voiceURI) ? "" : " For a more natural one, download a Premium or Enhanced Chinese (China) voice in Settings > Accessibility > Spoken Content > Voices.") :"No Mandarin voice found yet. On iPad, add one in Settings > Accessibility > Spoken Content > Voices > Chinese (China).";
  $("#testVoice").onclick = () => speak("你好，我叫王小明。");
  let armed = false;
  $("#resetBtn").onclick = () => {
    // armed for 4 s only, like End, so a stray tap minutes later can never erase everything
    if (!armed) { const was = [$("#resetBtn").textContent, $("#resetNote").textContent]; armed = true; $("#resetBtn").textContent = "Tap again to erase everything"; $("#resetNote").textContent = "This cannot be undone."; setTimeout(() => { if (!$("#resetBtn")) return; armed = false; [$("#resetBtn").textContent, $("#resetNote").textContent] = was; }, 4000); return; }
    const keep = P.settings, cur = P.cur; adopt(blank()); P.settings = keep; P.cur = cur; save(); renderSettings();
  };
  $("#done").onclick = closeSettings;
}

/* ---------------- Boot ---------------- */
async function boot() {
  const local = loadLocal(); if (local) adopt(local);
  setSync("", "Connecting");
  connectDb();
  try {
    const [w, s, t, x, rd] = await Promise.all(["words.json", "strokes.json", "lessons.json", "exercises/translation.json", "exercises/reading.json"].map(f => fetch(f).then(r => r.json())));
    WORDS = w; STROKES = s; TEXTS = t; TRANS = Object.fromEntries(x.lessons.map(L => [L.lesson, L.items]));
    READS = Object.fromEntries(rd.lessons.map(L => [L.lesson, L.passages]));
  } catch (e) {
    main.innerHTML = `<div class="loading">The word list did not load. Check your connection and reload the page.</div>`;
    return;
  }
  const num = l => l.split(".").map(Number);
  LESSONS = [...new Set(WORDS.map(w => w.l))].sort((a, b) => { const [a1, a2] = num(a), [b1, b2] = num(b); return a1 - b1 || a2 - b2; });
  LESSONS.forEach(l => byLesson[l] = WORDS.filter(w => w.l === l));
  if (!byLesson[P.cur]) P.cur = "1.1";
  if (typeof HanziWriter === "undefined") {
    main.innerHTML = `<div class="loading">The handwriting engine did not load. Check your connection and reload the page.</div>`;
    return;
  }
  let welcomed = false; try { welcomed = !!localStorage.getItem(WELCOME_KEY); } catch (e) {}
  if (welcomed) go("home"); else renderWelcome();
}
boot();
})();
</script>

<title>Zìtiè Chinese Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: a calm study desk. Header bar, then one working view at a time; practice paper (田字格) is the hero object. */
:root {
  --paper: #f3f6f4;
  --card: #ffffff;
  --ink: #17252a;
  --muted: #5d6f72;
  --line: #d6e0dd;
  --jade: #1d6b58;
  --jade-soft: #dcefe8;
  --grid: #d9534f;
  --grid-soft: rgba(217, 83, 79, .45); /* the 田字格 guides stay visible in bright light */
  --frame: rgba(217, 83, 79, .5); /* a blank box: copybook red, softer than the red of a mistake */
  --good: #237a3b;
  --warn: #8f5500;
  --bad: #b3261e;
  --good-bg: #e2f3e6;
  --warn-bg: #fbefd9;
  --bad-bg: #fbe3e1;
  --stroke: #17252a;
  --lift: 0 1px 2px rgba(23, 37, 42, .06), 0 6px 18px rgba(23, 37, 42, .05);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --f-han: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-ui: "Source Sans 3", -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111a1c; --card: #182427; --ink: #e5eeec; --muted: #9db0b1; --line: #2c3c3f;
  --jade: #5fc4a6; --jade-soft: #1d3a33; --grid: #e57b74; --grid-soft: rgba(229, 123, 116, .3); --frame: rgba(229, 123, 116, .42);
  --good: #6fd08a; --warn: #f0b45a; --bad: #ff8a80; --good-bg: #183424; --warn-bg: #3a2c12; --bad-bg: #3d1d1b;
  --stroke: #e5eeec; --lift: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .18); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #111a1c; --card: #182427; --ink: #e5eeec; --muted: #9db0b1; --line: #2c3c3f;
  --jade: #5fc4a6; --jade-soft: #1d3a33; --grid: #e57b74; --grid-soft: rgba(229, 123, 116, .3); --frame: rgba(229, 123, 116, .42);
  --good: #6fd08a; --warn: #f0b45a; --bad: #ff8a80; --good-bg: #183424; --warn-bg: #3a2c12; --bad-bg: #3d1d1b;
  --stroke: #e5eeec; --lift: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .18); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
/* no grey tap flash and no pull-to-refresh: a stray swipe mid-session must not reload the page */
html { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; accent-color: var(--jade); }
body {
  background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 17px; line-height: 1.5;
  -webkit-text-size-adjust: 100%; overscroll-behavior-y: none;
}
::selection { background: var(--jade-soft); color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--jade); outline-offset: 2px; }
.wrap {
  max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(32px + env(safe-area-inset-bottom, 0px));
}
header.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper);
  border-bottom: 1px solid var(--line);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
header.bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; gap: 10px; background: none; border: 0; padding: 0; min-height: 44px; align-items: center; }
.brand .seal {
  font-family: var(--f-han); font-weight: 700; font-size: 20px; color: var(--card); background: var(--grid);
  width: 38px; height: 38px; display: grid; place-items: center; border-radius: 6px; align-self: center;
}
.brand b { font-size: 19px; letter-spacing: .01em; }
.brand span { color: var(--muted); font-size: 14px; }
.sync { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.ok i { background: var(--good); }
.sync.local i { background: var(--warn); }
.iconbtn { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 15px; min-height: 44px; }
.themebtn { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; }
/* the button shows what a tap switches to: a moon in light mode, a sun in dark mode */
.themebtn .sun, .themebtn[data-dark] .moon { display: none; }
.themebtn[data-dark] .sun { display: inline; }

h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font-size: 22px; }
.eyebrow { font-size: 14px; color: var(--muted); margin-bottom: 2px; }
.view { display: flex; flex-direction: column; gap: 22px; padding-top: 22px; }

/* Home */
.today { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.today { box-shadow: var(--lift); }
.today h1 { font-size: 26px; }
.today h1 .han { font-family: var(--f-han); display: block; font-size: 20px; font-weight: 500; color: var(--muted); margin-top: 4px; }
.today h1 .han .w { white-space: nowrap; }
.today p { margin: 4px 0 0; color: var(--muted); text-wrap: pretty; }
.today .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 18px; font-weight: 600; min-height: 48px; }
.btn.primary { background: var(--jade); border-color: var(--jade); color: var(--paper); }
.btn:disabled { opacity: .45; cursor: default; }
/* "This is your current lesson" is a status, not a dead button */
#setCur:disabled, #wlCur:disabled { opacity: 1; background: none; border-color: transparent; color: var(--muted); font-weight: 400; }
/* press feedback lands on touch-down, as native buttons do; hover only where there's a real pointer */
/* press feedback is transform only; colours change instantly so a theme switch never shows text and background out of step */
.btn, .iconbtn, .mode, .lesson, .tile, .tbtn, .seg button, .whead { transition: transform 120ms var(--ease-out); }
.btn:active:not(:disabled), .iconbtn:active, .mode:active, .lesson:active, .tile:active, .tbtn:active:not(:disabled), .seg button:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) {
  .btn:hover:not(:disabled):not(.primary), .iconbtn:hover, .mode:hover, .lesson:hover, .tile:hover, .tbtn:hover:not(:disabled):not([aria-pressed="true"]), .seg button:hover:not([aria-pressed="true"]) { border-color: var(--jade); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
}
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.mode { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 132px; box-shadow: var(--lift); }
.mode .glyph { font-family: var(--f-han); font-size: 30px; line-height: 1; color: var(--jade); }
.mode b { font-size: 17px; }
.mode small { color: var(--muted); font-size: 14px; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--jade-soft); color: var(--jade); align-self: flex-start; }
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.lesson { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--lift); }
.lesson.cur { border-color: var(--jade); box-shadow: inset 0 0 0 1px var(--jade), var(--lift); }
.lesson .top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.lesson .num { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.lesson .sample { font-family: var(--f-han); color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lesson .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--jade); border-radius: 99px; }
.sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sechead p { margin: 0; color: var(--muted); font-size: 14px; }

/* Setup sheet */
.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 18px; box-shadow: var(--lift); }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .lbl { font-weight: 600; font-size: 15px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 14px; min-height: 44px; }
/* a chosen option is tinted, so it never looks like the solid jade of the action button (Start, Check) */
.seg button[aria-pressed="true"] { background: var(--jade-soft); color: var(--jade); border-color: var(--jade); font-weight: 600; }
select { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); min-height: 44px; max-width: 100%; }
.note { color: var(--muted); font-size: 14px; margin: 0; text-wrap: pretty; }

/* Practice */
.practice { display: flex; flex-direction: column; gap: 18px; align-items: center; padding-top: 18px; }
.ptop { width: 100%; display: flex; align-items: center; gap: 12px; }
.ptop .count { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.ptop .track { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.ptop .track i { display: block; height: 100%; background: var(--jade); }
.prompt { text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.prompt .py { font-size: clamp(34px, 6vw, 52px); font-weight: 700; letter-spacing: .02em; line-height: 1.1; }
.prompt .hint { font-size: 19px; color: var(--muted); }
.prompt .hint em { font-style: normal; font-size: 14px; border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; margin-left: 6px; }
.boxes {
  display: flex; gap: 12px; justify-content: center; flex-wrap: nowrap; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; max-width: 100%;
}
.box { position: relative; background: var(--card); border: 2px solid var(--frame); border-radius: 4px; flex: 0 1 auto; max-width: 100%; aspect-ratio: 1; box-shadow: var(--lift); } /* shrinks if the screen narrows mid-card (an iPad turned to portrait); ink and pen input scale with it */
.box svg.grid { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.box .hw { position: absolute; inset: 0; }
.box.done { border-color: var(--good); }
.col { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.box canvas.ink { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.box.wrongbox { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad), var(--lift); } /* a wrong box is unmistakable next to the soft red of blank paper */
.model { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; max-width: 100%; min-width: 0; }
.prompt .py.small { font-size: 22px; font-weight: 600; } /* in translation the pinyin is a hint, smaller than the English it answers */
.model .mw { width: var(--mw, 64px); height: var(--mw, 64px); max-width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 4px; }
.mnote { font-size: 14px; font-weight: 600; max-width: 100%; overflow-wrap: anywhere; color: var(--muted); }
.legend { margin-top: 8px; font-weight: 400; } .lg-warn { color: var(--warn); } .lg-bad { color: var(--bad); }
.mnote.good { color: var(--good); } .mnote.bad { color: var(--bad); }
.boxes { align-items: flex-start; }
.boxes.wrapping { flex-wrap: wrap; row-gap: 14px; justify-content: flex-start; } /* rows start at the left, so adding a box never moves the one being written in */
.rule { margin: 10px auto 0; max-width: 34em; text-wrap: pretty; font-size: 17px; color: var(--ink); text-align: left; font-weight: 400; } /* the rule a grammar miss teaches, at reading size */
.verdict { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
.feedback { min-height: 30px; font-weight: 600; text-align: center; }
.pill { display: inline-flex; font-size: 15px; white-space: nowrap; font-weight: 600; gap: 8px; align-items: center; padding: 6px 14px; border-radius: 99px; }
/* the feedback line can carry a whole translated sentence, so it wraps instead of running off a phone screen */
.feedback .pill { white-space: normal; flex-wrap: wrap; justify-content: center; max-width: 100%; border-radius: 18px; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill .han { font-family: var(--f-han); font-size: 20px; }
.pill.bad .han { color: var(--ink); } /* the right answer is shown in ink, not in the colour of the mistake */
.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.controls .btn { min-width: 110px; }
.inktools { display: flex; gap: 8px; justify-content: center; }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: 15px; }
.btn.quiet { background: none; border-color: transparent; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; min-width: 0; }
/* Check stays on screen while the boxes scroll, however many there are */
.peek summary { cursor: pointer; color: var(--muted); font-size: 15px; padding: 11px 0; }
.peek[open] summary { margin-bottom: 10px; }
/* the dock holds the verdict and the actions; it stays at the bottom of the screen while the card scrolls */
.dock { z-index: 3; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--paper); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); }
.dock .feedback:empty { display: none; }
.notes { text-align: center; }
.notes:empty { display: none; }
/* pinned only when the screen is tall enough; on a short landscape phone it would cover the top bar */
@media (min-height: 520px) { .dock { position: sticky; bottom: 0; } }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.stepper .btn { border: 0; min-width: 48px; padding: 8px; font-size: 22px; line-height: 1; }
.stepper span { min-width: 76px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.gq.en { font-family: var(--f-ui); font-weight: 600; font-size: clamp(24px, 4.5vw, 34px); line-height: 1.3; }
.prompt .listen { margin-top: 10px; }
.prompt .note { margin-top: 4px; }

/* Summary */
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score .big { font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.results { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--lift); }
.results .row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 12px; padding: 12px 16px; align-items: center; border-top: 1px solid var(--line); }
.results .row:first-child { border-top: 0; }
.results .han { font-family: var(--f-han); font-size: 24px; }
.results .muted { color: var(--muted); font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
/* the round ends like a corrected copybook page: your own characters, red and amber marks included, in small 田字格 */
.results .inkrow { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.results .inkrow img { width: 52px; height: 52px; border: 1.5px solid var(--frame); border-radius: 3px;
  background: linear-gradient(var(--grid-soft), var(--grid-soft)) center / 100% 1px no-repeat, linear-gradient(var(--grid-soft), var(--grid-soft)) center / 1px 100% no-repeat, var(--card); }
/* translation results: the sentence gets the full width, its pinyin and English underneath */
.results.tr .row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; }
.results.tr .row > :nth-child(2), .results.tr .row .muted { grid-column: 1 / -1; }
.results.tr .row .pill { grid-row: 1; grid-column: 2; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }
.settings-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }


/* Learn */
.wlist { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--lift); }
.wrow + .wrow { border-top: 1px solid var(--line); }
.whead { width: 100%; background: none; border: 0; text-align: left; display: grid; grid-template-columns: minmax(90px, auto) minmax(90px, .8fr) minmax(0, 1.6fr) auto; gap: 12px; align-items: center; padding: 12px 16px; min-height: 56px; }
.whead .han { font-family: var(--f-han); font-size: 26px; }
.whead .wpy { font-weight: 600; }
.whead .muted { color: var(--muted); font-size: 15px; min-width: 0; }
.wlist > .whead + .whead { border-top: 1px solid var(--line); }
.whead[aria-pressed="true"] { background: var(--jade-soft); }
.wbody { padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.wchars { display: flex; gap: 12px; flex-wrap: wrap; }
.wchar { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.anim { background: var(--card); border: 1px solid var(--grid-soft); border-radius: 4px; }
.related { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.rel { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 15px; }
.rel .han { font-family: var(--f-han); font-size: 18px; }
.rel em { font-style: normal; color: var(--muted); font-size: 13px; }
.pill.small { font-size: 13px; padding: 3px 10px; }
.pill.new { background: var(--line); color: var(--ink); }
.pill.learn { background: var(--jade-soft); color: var(--jade); }
/* a shown answer is a study choice, so it gets a calm mark instead of the red of a mistake */
.pill.shown { background: var(--line); color: var(--ink); }
.flash { width: min(560px, 100%); min-height: 330px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; display: grid; place-items: center; padding: 24px; box-shadow: 0 1px 0 var(--line), 0 10px 30px rgba(0,0,0,.06); }
.flash.flipped { border-color: var(--jade); }
.fc-front, .fc-back { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.fc-han { font-family: var(--f-han); font-size: clamp(64px, 14vw, 110px); line-height: 1.1; }
.fc-han.small { font-size: clamp(48px, 10vw, 72px); }
.fc-en { font-size: 24px; font-weight: 600; }
.fc-py { font-size: 30px; font-weight: 700; }
.fc-row { display: flex; gap: 10px; justify-content: center; }
.fc-tap { margin-top: 10px; }
.rate-again { color: var(--bad); } .rate-hard { color: var(--warn); } .rate-good { color: var(--good); } .rate-easy { color: var(--jade); }
.han-inline { font-family: var(--f-han); font-size: 20px; color: var(--ink); }
.match { width: 100%; max-width: 760px; display: grid; grid-template-columns: minmax(0, .7fr) minmax(0, 1.3fr); gap: 14px; }
.mcol { display: flex; flex-direction: column; gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; min-height: 58px; padding: 10px 14px; font-size: 17px; text-align: center; transition: opacity 200ms var(--ease-out), transform 150ms var(--ease-out); }
.tile.han-tile { font-family: var(--f-han); font-size: 28px; }
.tile.picked { border-color: var(--jade); box-shadow: 0 0 0 3px var(--jade-soft); }
.tile.bad { border-color: var(--bad); background: var(--bad-bg); transform: translateX(3px); }
.tile.gone { opacity: 0; pointer-events: none; }
.tones { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.tcol { display: flex; flex-direction: column; gap: 8px; align-items: stretch; min-width: 110px; }
.tcol .han { font-family: var(--f-han); font-size: 40px; text-align: center; }
.tbtn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; min-height: 44px; padding: 8px 12px; }
.tbtn[aria-pressed="true"] { background: var(--jade-soft); border-color: var(--jade); color: var(--jade); font-weight: 600; }
.tbtn.right { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 700; }
.tbtn.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.tones .tbtn.right::after { content: " · right"; } .tones .tbtn.wrong::after { content: " · yours"; } /* not colour alone */
/* results outrank the jade "selected" fill of options inside .seg, and say right / wrong in words too, not only colour */
.seg .tbtn.right { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 700; }
.seg .tbtn.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.seg .tbtn.right::after { content: " · right"; font-weight: 600; }
.seg .tbtn.right::after, .seg .tbtn.wrong::after, .tones .tbtn::after { font-family: var(--f-ui); font-size: 15px; } /* the verdict word is UI text, even on a 汉字 tile */

}

<header class="bar"><div class="wrap">
  <button class="brand" id="brand" type="button" aria-label="Home"><span class="seal">字</span><b>Zìtiè</b><span>Unofficial study companion</span></button>

  <button class="iconbtn themebtn" id="themeBtn" type="button" aria-label="Switch to dark mode"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/><g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg></button>
  <button class="iconbtn" id="settingsBtn" type="button">Settings</button>
</div></header>

<main class="wrap" id="main"><div class="loading">Loading your lessons and stroke data…</div></main>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.2/dist/hanzi-writer.min.js"></script>
<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const main = $("#main");
const DAY = 864e5;
const INTERVALS = [0, 1, 3, 7, 14, 30]; // days, by stage after a correct answer

let WORDS = [], STROKES = {}, LESSONS = [], byLesson = {};

/* ---------------- Progress store (synced via db, mirrored locally) ---------------- */
const LS_KEY = "zitie-progress-v1";
function blank() { return { v: 1, cur: "1.1", settings: { input: "auto", marking: "standard", sawPencil: false }, w: {}, tr: {}, rd: {}, flag: {}, hist: [], updatedAt: 0 }; }
let P = blank();
let dbRef = null, saveTimer = null, saving = false, dirty = false;

function setSync(state, text) {
  const s = $("#sync"); s.className = "sync " + state; s.title = text; s.querySelector("span").textContent = text;
}
function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(P)); } catch (e) {} }
function adopt(data) {
  const b = blank();
  P = Object.assign(b, data || {});
  P.settings = Object.assign(blank().settings, (data && data.settings) || {});
  P.w = P.w || {}; P.hist = P.hist || [];
}
function save() {
  P.updatedAt = Date.now();
  saveLocal();
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 1200);
}
async function flush() {
  if (!dbRef || saving || !dirty) return;
  saving = true; dirty = false;
  try { await dbRef.set(JSON.parse(JSON.stringify(P))); setSync("ok", "Synced"); }
  catch (e) {
    if (e && e.code === "unavailable") { dirty = true; setTimeout(flush, 2000 + Math.random() * 2000); }
    else if (e && (e.code === "invalid_argument" || e.code === "revoked")) { dbRef = null; setSync("local", "Saved on this device"); }
    else { dirty = true; }
  }
  saving = false;
  if (dirty) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200); }
}
async function connectDb() {
  try {
    if (!window.claude || !window.claude.use) throw 0;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) throw 0;
    const uid = await user.id();
    if (!uid) throw 0;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && (remote.updatedAt || 0) > (P.updatedAt || 0)) { adopt(JSON.parse(JSON.stringify(remote))); saveLocal(); refresh(); }
    else if (P.updatedAt) { dirty = true; flush(); }
    setSync("ok", "Synced");
    dbRef.onSnapshot(s => {
      if (!s.exists || s.metadata.hasPendingWrites) return;
      const d = s.data();
      if ((d.updatedAt || 0) > (P.updatedAt || 0) && !session) { adopt(JSON.parse(JSON.stringify(d))); saveLocal(); refresh(); }
    }, () => setSync("local", "Saved on this device"));
  } catch (e) {
    dbRef = null; setSync("local", "Saved on this device");
  }
}
function refresh() { if (route === "home") renderHome(); }

/* ---------------- Word progress ---------------- */
function rec(id) { return P.w[id] || null; }
function mastered(id) { const r = rec(id); return !!r && r.st >= 3; }
function isDue(id, now = Date.now()) { const r = rec(id); return !!r && r.due <= now; }
function grade(id, result) {
  const now = Date.now();
  const r = P.w[id] || { st: 0, n: 0, c: 0, m: 0, due: now, last: 0 };
  r.n++; r.last = now;
  if (result === "good") { r.c++; r.st = Math.min(r.st + 1, INTERVALS.length - 1); r.due = now + INTERVALS[r.st] * DAY; }
  else if (result === "close") { r.c++; r.due = now + DAY; }
  else { r.m++; r.st = 0; r.due = now + 10 * 60 * 1000; }
  P.w[id] = r;
}

/* ---------------- Flagged words ---------------- */
// keyed by the characters, so a word the course repeats in two lessons is one flag
const isFlagged = w => !!P.flag[w.t];
const flagText = w => isFlagged(w) ? "★ Flagged" : "☆ Flag";
function toggleFlag(w) { if (P.flag[w.t]) delete P.flag[w.t]; else P.flag[w.t] = Date.now(); save(); }
const flaggedWords = () => uniqueWords(WORDS.filter(isFlagged)).sort((a, b) => P.flag[b.t] - P.flag[a.t]);
// a flag button kept in step with the word's state
const wireFlag = (btn, w, after) => {
  const paint = () => { btn.textContent = flagText(w); btn.setAttribute("aria-pressed", String(isFlagged(w))); };
  btn.onclick = e => { e.stopPropagation(); toggleFlag(w); paint(); if (after) after(); };
  paint();
};

/* ---------------- Speech ---------------- */
let zhVoice = null;
function pickVoice() {
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  // the most natural Mandarin voice installed: iPad marks downloaded voices "Premium" or "Enhanced" (in name or voiceURI);
  // mainland voices (zh-CN) beat Taiwan / Hong Kong ones, and the compact default is the last resort
  const score = v => (/premium/i.test(v.name + v.voiceURI) ? 4 : /enhanced/i.test(v.name + v.voiceURI) ? 2 : 0) + (/zh[-_]CN/i.test(v.lang) ? 1 : 0);
  zhVoice = vs.filter(v => /^zh/i.test(v.lang)).sort((a, b) => score(b) - score(a))[0] || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate = 0.85) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN"; u.rate = rate; if (zhVoice) u.voice = zhVoice;
  speechSynthesis.speak(u);
}

/* ---------------- Routing ---------------- */
let route = "home", session = null;
function go(r) { route = r; if (r === "home") { session = null; renderHome(); } window.scrollTo(0, 0); }
$("#brand").onclick = () => go("home");
// a keyboard (an iPad with a Magic Keyboard): Enter does the card's main action (Check, then Next), Esc closes the word card
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#wpClose")) return $("#wpClose").click();
  if (e.target.closest("input, select, textarea")) return;
  // flashcards: Space flips, 1–4 rate Again / Hard / Good / Easy
  if ($("#flash") && ((e.key === " " && !e.target.closest("button")) || /^[1-4]$/.test(e.key))) {
    const r = e.key === " " ? $("#flash") : $(`[data-r="${["again", "hard", "good", "easy"][e.key - 1]}"]`);
    if (r) { e.preventDefault(); r.click(); } return;
  }
  if (e.key !== "Enter" || e.target.closest("button, summary, a")) return;
  const b = $("#ctl .btn.primary");
  if (b && !b.disabled) { e.preventDefault(); b.click(); }
});
// Settings sets the current page aside, nodes and all, so Done returns to it exactly as it was (half-written ink included)
let behindSettings = null;
$("#settingsBtn").onclick = () => {
  if (route === "settings") return;
  behindSettings = { nodes: [...main.childNodes], route, y: window.scrollY };
  route = "settings"; renderSettings();
};
function closeSettings() {
  const b = behindSettings; behindSettings = null;
  if (!b || b.route === "home") return go("home"); // home is redrawn so its counts are current
  route = b.route; main.replaceChildren(...b.nodes); window.scrollTo(0, b.y);
}

/* ---------------- Light / dark ---------------- */
// follows the device until you tap the toggle; the choice is kept on this device only
const THEME_KEY = "zitie-theme", darkQuery = matchMedia("(prefers-color-scheme: dark)");
let onTheme = null; // set by an open Write card so its ink is redrawn in the new colours
function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t ? t === "dark" : darkQuery.matches;
  $("#themeBtn").toggleAttribute("data-dark", dark); // the label says what a tap does; no pressed state to contradict it
  $("#themeBtn").setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  const paper = getComputedStyle(document.documentElement).getPropertyValue("--paper").trim();
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.content = paper);
  if (onTheme) onTheme();
}
let savedTheme = null;
try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
applyTheme(savedTheme);
darkQuery.addEventListener("change", () => { if (!document.documentElement.dataset.theme) applyTheme(null); });
$("#themeBtn").onclick = () => {
  const next = $("#themeBtn").hasAttribute("data-dark") ? "light" : "dark";
  // switching back to what the device uses anyway drops the choice, so the app follows the device again
  const follow = next === (darkQuery.matches ? "dark" : "light");
  try { if (follow) localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, next); } catch (e) {}
  applyTheme(follow ? null : next);
};

// a turned iPad or a resized window lays a fresh card out again for its new size, while nothing is written on it yet
let resizeT = 0, lastW = innerWidth, lastH = innerHeight;
addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (innerWidth === lastW && Math.abs(innerHeight - lastH) < 120) return; // the Safari toolbar showing or hiding is not a new layout
    lastW = innerWidth; lastH = innerHeight;
    const st = session && session.cur;
    if (st && !st.done && !st.order.length && main.querySelector("#boxes")) renderCard();
  }, 200);
});

/* ---------------- Home ---------------- */
function lessonStats(l) {
  const ws = byLesson[l] || [];
  return { total: ws.length, mastered: ws.filter(w => mastered(w.id)).length, seen: ws.filter(w => rec(w.id)).length };
}
function dueWords() { const now = Date.now(); return uniqueWords(WORDS.filter(w => isDue(w.id, now))); }

function renderHome() {
  const cur = P.cur, cs = lessonStats(cur), due = dueWords().length;
  // each word is kept whole when the sample wraps, so 大学 never splits across lines
  const curSample = (byLesson[cur] || []).slice(0, 6).map(w => `<span class="w">${esc(w.d)}</span>`).join(" ");
  main.innerHTML = `
  <div class="view">
    <section class="today">
      <div>
        <div class="eyebrow">You are on</div>
        <h1>Lesson ${esc(cur)} <span class="han">${curSample}</span></h1>
        <p>${cs.seen} of ${cs.total} words practised · ${cs.mastered} mastered${due ? ` · ${due} word${due === 1 ? "" : "s"} due for review` : ""}</p>
      </div>
      <div class="actions">
        ${due ? `<button class="btn" id="reviewBtn" type="button">复习 ${due} due</button>` : ""}
        <button class="btn" id="dictCur" type="button">听写 lesson ${esc(cur)}</button>
        <button class="btn primary" id="startCur" type="button">Write lesson ${esc(cur)}</button>
      </div>
    </section>

    <section class="modes" aria-label="Practice modes">
      <button class="mode" id="modeLearn" type="button"><span class="glyph">学</span><b>Learn</b><small>Word list, flashcards, trace and copy, match game and tones.</small></button>
      <button class="mode" id="modeWrite" type="button"><span class="glyph">写</span><b>Write</b><small>See the pinyin, write the characters in your own hand, then check them.</small></button>
      <button class="mode" id="modeDict" type="button"><span class="glyph">听写</span><b>Dictation</b><small>Hear a word in Mandarin and write it down, no pinyin shown.</small></button>
      <button class="mode" id="modeTrans" type="button"><span class="glyph">译</span><b>Translation</b><small>Read an English sentence and write it in Chinese by hand.</small></button>
      <button class="mode" id="modeReview" type="button"><span class="glyph">复习</span><b>Review</b><small>Words that are due again, from every lesson, oldest first.</small><span class="tag">${due ? `${due} due` : "Up to date"}</span></button>
      <button class="mode" id="modeRead" type="button"><span class="glyph">读</span><b>Reading &amp; listening</b><small>A dialogue, a story and a short text for each lesson, with questions. Read them or just listen.</small></button>
      <button class="mode" id="modeGrammar" type="button"><span class="glyph">语法</span><b>Grammar</b><small>Each lesson's grammar points, then gap-fill and word-order quizzes.</small></button>
    </section>

    <section class="view" style="padding-top:0;gap:12px">
      <div class="sechead"><h2>Lessons</h2><p>Tap a lesson to see its words. Green bars show words you have mastered.</p></div>
      <div class="lessons">${LESSONS.map(l => {
        const s = lessonStats(l), pct = s.total ? Math.round(100 * s.mastered / s.total) : 0;
        return `<button class="lesson${l === cur ? " cur" : ""}" type="button" data-l="${l}">
          <div class="top"><span class="num">${l}</span><span class="meta">${s.total} words</span></div>
          <div class="sample">${esc(byLesson[l].slice(0, 5).map(w => w.d).join(" "))}</div>
          <div class="meter" aria-label="${pct}% mastered"><i style="width:${pct}%"></i></div>
          <div class="meta">${s.mastered} mastered${l === cur ? " · current" : ""}</div>
        </button>`;
      }).join("")}</div>
    </section>
  </div>`;
  // starts straight away with the Write settings last used (Write on the mode grid opens them)
  $("#startCur").onclick = () => { let pool = buildPool(cur); if (setup.order === "shuffle") pool = shuffle(pool); if (setup.count) pool = pool.slice(0, setup.count); if (pool.length) startWrite(pool, "Lesson " + cur); else renderSetup(cur); };
  if (due) $("#reviewBtn").onclick = renderReview; // the daily queue is one tap from the top
  // one tap to a real 听写: every word of the current lesson, shuffled, with the clue setting from Dictation (sound only by default)
  $("#dictCur").onclick = () => !zhVoice ? renderSetup(cur, "dict") /* no voice: the setup screen says how to add one */ : startWrite(shuffle((byLesson[cur] || []).filter(dictable)), "Lesson " + cur, { dict: true, clue: setup.clue });
  $("#modeWrite").onclick = () => renderSetup(cur);
  $("#modeLearn").onclick = () => renderLearn(cur);
  $("#modeDict").onclick = () => renderSetup(cur, "dict");
  $("#modeReview").onclick = renderReview;
  $("#modeTrans").onclick = () => renderTranslate(cur);
  $("#modeRead").onclick = () => renderRead(cur);
  $("#modeGrammar").onclick = () => renderGrammar(cur);
  main.querySelectorAll(".lesson").forEach(b => b.onclick = () => renderWordList(b.dataset.l, "home"));
}

/* ---------------- Review queue ---------------- */
function renderReview() {
  route = "review"; session = null;
  const now = Date.now();
  const byDue = (a, b) => rec(a.id).due - rec(b.id).due;
  const due = dueWords().sort(byDue);
  const soon = uniqueWords(WORDS.filter(w => rec(w.id) && rec(w.id).due > now && !due.some(d => d.t === w.t))).sort(byDue);
  const within = ms => soon.filter(w => rec(w.id).due <= now + ms).length;
  const when = t => { const d = t - now; return d < 3600e3 ? `in ${Math.max(1, Math.round(d / 60e3))} min` : d < DAY ? `in ${Math.round(d / 3600e3)} h` : Math.round(d / DAY) === 1 ? "tomorrow" : `in ${Math.round(d / DAY)} days`; };
  const writeBatch = due.slice(0, 20), dictBatch = due.filter(dictable).slice(0, 20);
  main.innerHTML = `
  <div class="view">
    <div class="sechead"><div><div class="eyebrow">Review · 复习</div><h2>${due.length ? `${due.length} word${due.length === 1 ? "" : "s"} due` : "Nothing due right now"}</h2></div>
      <button class="btn" id="back" type="button">Back</button></div>
    <p class="note">${due.length ? "Oldest first, up to 20 a round. " : soon.length ? `Next word comes back ${when(rec(soon[0].id).due)}. ` : "Words you practise show up here when they are due again."}${due.length || soon.length ? `${within(DAY)} more due in the next 24 hours, ${within(7 * DAY)} in the next 7 days.` : ""}</p>
    ${due.length ? `<div class="settings-row"><button class="btn primary" id="revWrite" type="button">Write ${plural(writeBatch.length, "word")}</button>${dictBatch.length ? `<button class="btn" id="revDict" type="button">Dictate ${plural(dictBatch.length, "word")}</button>${dictBatch.length < writeBatch.length ? `<span class="note">Grammar patterns such as 太……了 are left out of dictation.</span>` : ""}` : ""}</div>
    <details class="peek"><summary>The ${due.length} word${due.length === 1 ? "" : "s"} (gives away the answers)</summary>
    <div class="results">${due.map(w => `<div class="row"><span class="han">${esc(w.d)}</span><span>${esc(w.p)}</span><span class="muted">${esc(w.h)}</span><span class="pill small ${stageLabel(w.id).cls}">${esc(w.l)}</span></div>`).join("")}</div></details>` :`<div class="settings-row"><button class="btn primary" id="revCur" type="button">Write lesson ${esc(P.cur)}</button></div>`}
  </div>`;
  $("#back").onclick = () => go("home");
  if (!due.length) $("#revCur").onclick = () => renderSetup(P.cur); // nothing due: carry on with the current lesson
  if (due.length) $("#revWrite").onclick = () => startWrite(shuffle(writeBatch), "Review");
  if (dictBatch.length) $("#revDict").onclick = () => startWrite(shuffle(dictBatch), "Review", { dict: true, clue: setup.clue });
  window.scrollTo(0, 0);
}

/* ---------------- Setup ---------------- */
// a class 听写 covers the whole lesson, so Dictation keeps its own count and starts at All
const setup = { scope: "this", count: 10, dcount: 0, order: "shuffle", clue: "sound" };
// kind "write" shows pinyin; kind "dict" (听写) plays the word and hides the pinyin
function renderSetup(lesson, kind = "write") {

function lessonIndex(l) { return LESSONS.indexOf(l); }
function buildPool(lesson) {
  const li = lessonIndex(lesson);
  const seen = new Set();
  let ws;
  if (setup.scope === "this") ws = byLesson[lesson].slice();
  else ws = WORDS.filter(w => lessonIndex(w.l) <= li);
  if (setup.scope === "weak") ws = ws.filter(w => !mastered(w.id));
  // the course repeats some words across lessons; keep the first copy of each character string
  return ws.filter(w => !seen.has(w.t) && seen.add(w.t));
}
// grammar patterns such as 太……了 make no sense read aloud, so dictation leaves them out
const dictable = w => !w.d.includes("…");
// words whose pinyin (tones included) matches a different course word, e.g. 他 / 她 / 它
const soundKey = w => w.p.toLowerCase().replace(/[\s'’·-]/g, "");
let SOUNDS = null;
function homophone(w) {
  if (!SOUNDS) { SOUNDS = {}; WORDS.forEach(o => (SOUNDS[soundKey(o)] = SOUNDS[soundKey(o)] || new Set()).add(o.t)); }
  return SOUNDS[soundKey(w)].size > 1;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------------- Write session ---------------- */
function startWrite(words, label, opts = {}) {
  session = { words, label, i: 0, results: [], trace: !!opts.trace, phase: opts.trace ? "trace" : "copy", dict: !!opts.dict, clue: opts.clue, drill: !!opts.drill, tr: !!opts.tr, lesson: opts.lesson, reps: 0, nbox: 0 };
  route = "write";
  renderCard();
}
function pencilOnly() {
  const s = P.settings;
  return s.input === "pencil" || (s.input === "auto" && s.sawPencil);
}

function gridSvg() {
  return `<svg class="grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" y1="50" x2="100" y2="50" stroke="var(--grid-soft)" stroke-width=".6" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>
    <line x1="50" y1="0" x2="50" y2="100" stroke="var(--grid-soft)" stroke-width=".6" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>
    <line x1="0" y1="0" x2="100" y2="100" stroke="var(--grid-soft)" stroke-width=".6" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>
    <line x1="100" y1="0" x2="0" y2="100" stroke="var(--grid-soft)" stroke-width=".6" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

/* ---------------- Marking (stroke matching adapted from Hanzi Writer's quiz) ----------------
   Strokes are compared in the character's 1024-unit space against the stroke medians. */
const Mark = (() => {
  const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
  const mag = p => Math.hypot(p.x, p.y);
  const dist = (a, b) => mag(sub(a, b));
  const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
  const last = a => a[a.length - 1];
  const len = pts => pts.slice(1).reduce((acc, p, i) => acc + dist(p, pts[i]), 0);
  const cos = (a, b) => (a.x * b.x + a.y * b.y) / mag(a) / mag(b);
  const extend = (p1, p2, d) => { const v = sub(p2, p1), n = d / mag(v); return { x: p2.x + n * v.x, y: p2.y + n * v.y }; };
  function frechet(c1, c2) {
    const L = c1.length >= c2.length ? c1 : c2, S = c1.length >= c2.length ? c2 : c1;
    let prev = [];
    for (let i = 0; i < L.length; i++) {
      const cur = [];
      for (let j = 0; j < S.length; j++) {
        const d = dist(L[i], S[j]);
        if (i === 0 && j === 0) cur.push(d);
        else if (j === 0) cur.push(Math.max(prev[0], d));
        else if (i === 0) cur.push(Math.max(cur[j - 1], d));
        else cur.push(Math.max(Math.min(prev[j], prev[j - 1], cur[j - 1]), d));
      }
      prev = cur;
    }
    return prev[S.length - 1];
  }
  function subdivide(c, maxLen = 0.05) {
    const out = c.slice(0, 1);
    for (const p of c.slice(1)) {
      const q = last(out), l = dist(p, q);
      if (l > maxLen) { const n = Math.ceil(l / maxLen), s = l / n; for (let i = 0; i < n; i++) out.push(extend(p, q, -s * (i + 1))); }
      else out.push(p);
    }
    return out;
  }
  function outline(c, n = 30) {
    const seg = len(c) / (n - 1), out = [c[0]], end = last(c), rest = c.slice(1);
    for (let i = 0; i < n - 2; i++) {
      let lp = last(out), rem = seg;
      for (;;) {
        if (!rest.length) break;
        const nd = dist(lp, rest[0]);
        if (nd < rem) { rem -= nd; lp = rest.shift(); }
        else { out.push(extend(lp, rest[0], rem - nd)); break; }
      }
    }
    out.push(end);
    return out;
  }
  function normalize(c) {
    const o = outline(c), m = { x: avg(o.map(p => p.x)), y: avg(o.map(p => p.y)) };
    const t = o.map(p => sub(p, m));
    const s = Math.sqrt(avg([t[0].x ** 2 + t[0].y ** 2, last(t).x ** 2 + last(t).y ** 2])) || 1;
    return subdivide(t.map(p => ({ x: p.x / s, y: p.y / s })));
  }
  const rot = (c, th) => c.map(p => ({ x: Math.cos(th) * p.x - Math.sin(th) * p.y, y: Math.sin(th) * p.x + Math.cos(th) * p.y }));
  const ROTS = [Math.PI / 16, Math.PI / 32, 0, -Math.PI / 32, -Math.PI / 16];
  const shapeFit = (a, b, tol) => { const na = normalize(a), nb = normalize(b); return Math.min(...ROTS.map(t => frechet(na, rot(nb, t)))) <= 0.4 * tol; };
  const avgDist = (pts, stroke) => avg(pts.map(p => Math.min(...stroke.map(q => dist(p, q)))));
  const dirMatch = (pts, stroke) => {
    const ev = pts.slice(1).map((p, i) => sub(p, pts[i]));
    const sv = stroke.slice(1).map((p, i) => sub(p, stroke[i]));
    return avg(ev.map(e => Math.max(...sv.map(s => cos(s, e))))) > 0;
  };
  // T: { pos: distance tolerance, shape: shape tolerance, near: halve the distance limit after the first stroke }
  function matchData(pts, stroke, idx, T, checkBackwards = true) {
    const lenc = T.pos;
    const ad = avgDist(pts, stroke);
    const within = ad <= 350 * (T.near && idx > 0 ? 0.5 : 1) * lenc;
    if (!within) return { ok: false, ad, back: false };
    const ends = dist(stroke[0], pts[0]) <= 250 * lenc && dist(last(stroke), last(pts)) <= 250 * lenc;
    const ok = ends && dirMatch(pts, stroke) && shapeFit(pts, stroke, T.shape) && lenc * (len(pts) + 25) / (len(stroke) + 25) >= 0.35;
    if (!ok && checkBackwards && matchData(pts.slice().reverse(), stroke, idx, T, false).ok) return { ok: false, ad, back: true };
    return { ok, ad, back: false };
  }
  const clean = pts => pts.filter((p, i) => i === 0 || p.x !== pts[i - 1].x || p.y !== pts[i - 1].y);

  // strict: strokes are matched as in free mode, then any stroke that breaks the book's order is marked
  function strict(user, meds, lenc) {
    const { marks, assign } = freeMatch(user, meds, lenc);
    const seq = assign.map((j, i) => ({ i, j })).filter(x => x.j >= 0);
    // longest run of strokes written in increasing book order (LIS); the rest are out of order
    const best = seq.map(() => 1), prev = seq.map(() => -1);
    for (let a = 0; a < seq.length; a++) for (let b = 0; b < a; b++) if (seq[b].j < seq[a].j && best[b] + 1 > best[a]) { best[a] = best[b] + 1; prev[a] = b; }
    const keep = new Set();
    let end = best.indexOf(Math.max(0, ...best));
    while (end >= 0) { keep.add(seq[end].i); end = prev[end]; }
    seq.forEach(x => { if (!keep.has(x.i)) marks[x.i] = "order"; });
    return marks;
  }
  // free: each user stroke may match any not-yet-used stroke of the character
  function freeMatch(user, meds, lenc) {
    const marks = user.map(() => "wrong"), assign = user.map(() => -1), pairs = [];
    user.forEach((raw, i) => {
      const pts = clean(raw);
      if (pts.length < 2) return;
      meds.forEach((s, j) => { const m = matchData(pts, s, j, lenc); if (m.ok) pairs.push({ i, j, ad: m.ad }); else if (m.back && marks[i] === "wrong") marks[i] = "backwards"; });
    });
    pairs.sort((a, b) => a.ad - b.ad);
    const used = new Set();
    for (const p of pairs) if (assign[p.i] < 0 && !used.has(p.j)) { used.add(p.j); assign[p.i] = p.j; marks[p.i] = "ok"; }
    return { marks, assign };
  }
  const free = (user, meds, lenc) => freeMatch(user, meds, lenc).marks;
  // writing the whole character smaller, bigger or off-centre in the box is not a stroke error:
  // move and scale the writing so its bounding box sits where the model character's does
  function align(user, meds) {
    const bb = pts => { const xs = pts.map(p => p.x), ys = pts.map(p => p.y); return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) }; };
    const u = bb(user.flat()), m = bb(meds.flat());
    if (!isFinite(u.x0)) return user;
    const us = Math.max(u.x1 - u.x0, u.y1 - u.y0), ms = Math.max(m.x1 - m.x0, m.y1 - m.y0);
    if (us < 20) return user;
    const k = Math.min(1.6, Math.max(0.6, ms / us));
    const uc = { x: (u.x0 + u.x1) / 2, y: (u.y0 + u.y1) / 2 }, mc = { x: (m.x0 + m.x1) / 2, y: (m.y0 + m.y1) / 2 };
    return user.map(st => st.map(p => ({ x: mc.x + (p.x - uc.x) * k, y: mc.y + (p.y - uc.y) * k })));
  }
  // standard shape 1.3: with align, passes ~93% of correct simulated writing (80% before) and still catches
  // every order or backwards error and about two-thirds of hooks written straight (see the README)
  const TOL = { standard: { pos: 1, shape: 1.3, near: true }, lenient: { pos: 1.8, shape: 2.6, near: false }, free: { pos: 1.6, shape: 2, near: false } };
  function character(user, data, mode) {
    const meds = data.medians.map(m => m.map(([x, y]) => ({ x, y })));
    const lenc = TOL[mode] || TOL.standard;
    user = align(user, meds);
    const marks = mode === "free" ? free(user, meds, lenc) : strict(user, meds, lenc);
    const good = marks.filter(m => m === "ok").length;
    return { marks, good, expected: meds.length, drawn: user.length, correct: good === meds.length && user.length === meds.length };
  }
  return { character };
})();

function markingMode() {
  const s = P.settings;
  if (!s.marking) s.marking = s.leniency > 1 ? "lenient" : "standard";
  return s.marking;
}

/* ---------------- Write card ---------------- */
function renderCard() {
  const s = session, w = s.words[s.i], tr = s.tr;
  // translation: a sentence starts with one row of boxes, whatever the answer's length (so the count gives nothing away),
  // grows a box whenever you write in the last one, and drops empty boxes at the end when checked.
  // The row length is fixed per screen, so boxes keep their size as they're added; a phone gets three to a row
  // a long word on a phone would give boxes too small to write in with a finger, so it wraps two to a row instead
  const oneRow = Math.floor((Math.min(main.clientWidth, 1040) - 32 - (w.t.length - 1) * 12) / w.t.length);
  const perRow = tr ? (main.clientWidth < 560 ? 3 : main.clientWidth < 900 ? 4 : 6) : w.t.length > 2 && oneRow < 120 ? 2 : w.t.length;
  const n = tr ? (s.nbox = s.nbox || perRow) : w.t.length;
  const tracing = s.trace && s.phase === "trace";
  const dict = s.dict, clue = dict && (s.clue !== "sound" || homophone(w));
  // drill: one chosen word, shown at the top, written as often as you like and never graded
  const drill = s.drill;
  // again: a practice try at the same word after it was graded; it starts fresh, with the answer hidden, and isn't graded
  const again = s.again;
  const nextLabel = tracing ? "Now write it from memory" : drill ? "Write it again" : s.i + 1 < s.words.length ? (tr ? "Next sentence" : "Next word") : "See results";
  const goNext = () => { s.again = false; if (tracing) { s.phase = "copy"; renderCard(); } else if (drill) { s.reps++; renderCard(); } else nextWord(); };
  const nextWord = () => { s.phase = s.trace ? "trace" : "copy"; s.nbox = 0; s.i++; if (s.i < s.words.length) renderCard(); else finish(); };
  const avail = Math.min(main.clientWidth, 1040) - 32;
  // also capped by screen height, so on a short landscape screen the boxes never run under the bottom dock
  const size = Math.max(70, Math.min(n <= 2 && !tr ? 400 : 300, Math.max(150, innerHeight - 500), Math.floor((avail - (perRow - 1) * 12) / perRow)));
  const pad = Math.round(size * 0.06);
  const boxHtml = k => `
      <div class="col" style="width:${size}px">
        <div class="box" style="width:${size}px" data-k="${k}">${gridSvg()}<div class="hw" id="hw${k}"></div><canvas class="ink" width="${size}" height="${size}" role="img" aria-label="Writing box ${k + 1}"></canvas></div>
        <div class="model" hidden><div class="mw" id="mw${k}"></div><span class="mnote"></span></div>
      </div>`;

    const css = getComputedStyle(document.documentElement), tok = (k, d) => css.getPropertyValue(k).trim() || d;
    return { ink: tok("--stroke", "#17252a"), jade: tok("--jade", "#1d6b58"), bad: tok("--bad", "#b3261e"), warn: tok("--warn", "#a86400") };
  };
  const C = colours();
  onTheme = () => {
    if (!main.contains(boxes[0])) return (onTheme = null);
    Object.assign(C, colours()); canvases.forEach((_, k) => redraw(k));
    // the model and answer characters are drawn once in SVG, so they are recoloured too
    if (st.modelFor) st.models.forEach((_, k) => st.modelFor(k, st.ms)); // redrawn in the new ink
    st.writers.forEach(wr => wr && wr.updateColor("strokeColor", C.jade));
  };
  main.innerHTML = `
  <div class="practice">
    <div class="ptop">
      <button class="iconbtn" id="quit" type="button">End</button>
      <div class="track"><i style="width:${100 * s.i / s.words.length}%"></i></div>
      <span class="count">${s.i + 1} / ${s.words.length}${drill ? ` · ${s.reps} written` : ""}</span>
    </div>
    <div class="prompt">
      <div class="eyebrow">${esc(s.label)}${s.trace ? (tracing ? " · step 1: trace over the outline" : " · step 2: now from memory") : dict ? " · 听写 · listen and write" : drill ? " · copy it as often as you like" : tr ? " · 译 · write it in Chinese" : s.label === "Lesson " + w.l ? "" : " · from lesson " + esc(w.l)}</div>
      ${drill ? `<div class="fc-han small" id="drillWord"${drillHide ? " hidden" : ""}>${esc(w.d)}</div><button class="btn" id="hideBtn" type="button">${drillHide ? "Show the word" : "Hide the word"}</button>` : ""}
      ${tr ? `<div class="gq en">${esc(w.h)}</div>${w.note ? `<div class="hint"><em>${esc(w.note)}</em></div>` : ""}` : ""}
      <div class="py${tr ? " small" : ""}" id="py"${dict || tr ? " hidden" : ""}>${esc(w.p)}</div>
      <div class="hint" id="hint"${(dict && !clue) || tr ? " hidden" : ""}>${esc(w.h)}${w.pos ? ` <em>${esc(w.pos)}</em>` : ""}</div>
      ${tr ? `<div class="stepper listen" role="group" aria-label="Number of boxes"><button class="btn" id="boxLess" type="button" aria-label="One box fewer">−</button><span id="boxCount"></span><button class="btn" id="boxMore" type="button" aria-label="One more box">+</button></div>` : ""}
      ${dict && clue && s.clue === "sound" ? `<p class="note">Sounds the same as another course word, so here is its meaning.</p>` : ""}
      ${dict ? `<div class="controls listen"><button class="btn" id="playBtn" type="button">Play again</button><button class="btn" id="slowBtn" type="button">Play slowly</button></div>` : ""}
      ${dict && !zhVoice ? `<p class="note"><b>No Mandarin voice found</b>, so nothing will play. On iPad, add one in Settings > Accessibility > Spoken Content > Voices > Chinese (China).</p>` : ""}
    </div>
    <div class="boxes${tr || perRow < n ? " wrapping" : ""}" id="boxes"${tr || perRow < n ? ` style="width:${perRow * size + (perRow - 1) * 12}px"` : ""}>${Array.from({ length: n }, (_, k) => boxHtml(k)).join("")}</div>
    <div class="notes" id="fbx"></div>
    <div class="dock" id="dock">
    <div class="inktools" id="tools"><!-- in the dock, so Undo is always within reach of the Pencil -->
      <button class="btn small" id="undoBtn" type="button">Undo stroke</button>
      <button class="btn small" id="clearBtn" type="button">Clear box</button>
    </div>
    <div class="feedback" id="fb" aria-live="polite">${again ? `<span class="pill warn">Practice try, your first one is already scored</span>` : ""}</div>
    <div class="controls pinned" id="ctl">
      <button class="btn" id="hintBtn" type="button">Hint</button>
      ${dict || tr ? `<button class="btn" id="pyBtn" type="button">Show pinyin</button>` : `<button class="btn" id="hearBtn" type="button">Hear it</button>`}
      <button class="btn primary" id="checkBtn" type="button">Check</button>
      <button class="btn quiet" id="revealBtn" type="button"${drill && !drillHide ? " hidden" : ""}>Show answer</button>
    </div>
    </div>
  </div>`;
  // End sits where a resting palm lands, so a graded round asks for a second tap before it stops
  let ending = 0;
  $("#quit").onclick = () => {
    if (drill) return renderPicker(s.lesson);
    if (!s.results.length && !st.order.length) return go("home"); // nothing written or scored: nothing to lose
    if (Date.now() - ending < 5000) return finish();
    ending = Date.now();
    $("#quit").textContent = `End now? ${s.results.length} of ${s.words.length} done`;
    setTimeout(() => { if ($("#quit")) $("#quit").textContent = "End"; }, 5000);
  };
  if (drill) $("#hideBtn").onclick = () => { drillHide = !drillHide; $("#drillWord").hidden = drillHide; $("#hideBtn").textContent = drillHide ? "Show the word" : "Hide the word"; $("#revealBtn").hidden = !drillHide; }; // with the word on screen, Show answer has nothing to show
  if (dict) {
    $("#playBtn").onclick = () => speak(w.t);
    $("#slowBtn").onclick = () => speak(w.t, 0.5);
    speak(w.t); // runs inside the tap that opened this card, so iPad Safari allows it
  } else if (!tr) $("#hearBtn").onclick = () => speak(w.t);

  const st = { ink: Array.from({ length: n }, () => []), order: [], hints: 0, revealed: false, done: false, marks: null, writers: [], models: [] };
  s.cur = st;
  const boxes = [...main.querySelectorAll(".box")];
  const canvases = boxes.map(b => b.querySelector("canvas.ink"));
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const loader = (ch, onLoad, onErr) => STROKES[ch] ? onLoad(STROKES[ch]) : onErr(new Error("no data for " + ch));
  const writerFor = (k, c, show) => {
    const wr = HanziWriter.create("hw" + k, c, {
      width: size, height: size, padding: pad, showCharacter: show, showOutline: tracing,
      strokeColor: C.jade, outlineColor: "rgba(127,127,127,.28)", renderer: "svg", charDataLoader: loader,
    });
    // a viewBox lets the model and outline scale with the box if it shrinks
    const svg = $("#hw" + k + " svg");
    if (svg) { svg.setAttribute("viewBox", `0 0 ${size} ${size}`); svg.style.width = svg.style.height = "100%"; }
    return wr;
  };
  const sizeCanvas = cv => { cv.width = size * dpr; cv.height = size * dpr; cv.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0); };
  canvases.forEach(sizeCanvas);
  [...w.t].slice(0, n).forEach((c, k) => { st.writers[k] = writerFor(k, c, false); });
  // translation adds and removes boxes in place, so what's written, hints and shown pinyin all stay
  const setCount = m => {
    m = Math.max(1, Math.min(24, m));
    while (boxes.length < m) {
      const k = boxes.length;
      $("#boxes").insertAdjacentHTML("beforeend", boxHtml(k));
      const b = $("#boxes").lastElementChild.querySelector(".box"), cv = b.querySelector("canvas.ink");
      boxes.push(b); canvases.push(cv); sizeCanvas(cv); st.ink.push([]);
      if ([...w.t][k]) st.writers[k] = writerFor(k, [...w.t][k], false);
    }
    while (boxes.length > m) {
      const k = boxes.length - 1;
      boxes.pop().parentElement.remove(); canvases.pop(); st.ink.pop(); st.writers.length = Math.min(st.writers.length, k);
      st.order = st.order.filter(x => x !== k);
    }
    s.nbox = m;
    $("#boxCount").textContent = `${m} box${m === 1 ? "" : "es"}`;
  };
  if (tr) {
    setCount(n);
    // − only takes away an empty last box, so it can never throw away writing
    $("#boxLess").onclick = () => { if (st.done) return; if (st.ink[boxes.length - 1].length) { $("#fb").innerHTML = `<span class="pill warn">Clear the last box first to remove it</span>`; return; } setCount(boxes.length - 1); };
    $("#boxMore").onclick = () => { if (!st.done) setCount(boxes.length + 1); };
  }

  // ink: each stroke is a list of {x, y, w} points in box pixels, drawn with Pencil pressure
  const base = Math.max(4, size / 26);
  const colorFor = m => m === "ok" || !m ? C.ink : (m === "order" || m === "backwards") ? C.warn : C.bad;
  function drawSeg(ctx, a, b, color) {
    ctx.strokeStyle = color; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.lineWidth = (a.w + b.w) / 2;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  function redraw(k) {
    const ctx = canvases[k].getContext("2d");
    ctx.clearRect(0, 0, size, size);
    st.ink[k].forEach((stroke, i) => {
      const color = colorFor(st.marks && st.marks[k] ? st.marks[k].marks[i] : null);
      if (stroke.length === 1) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(stroke[0].x, stroke[0].y, stroke[0].w / 2, 0, 7); ctx.fill(); }
      for (let j = 1; j < stroke.length; j++) drawSeg(ctx, stroke[j - 1], stroke[j], color);
    });
  }
  const widthFor = e => {
    const pr = e.pointerType === "pen" ? (e.pressure || 0.5) : 0.55;
    return base * (0.45 + 1.1 * pr);
  };

  // Apple Pencil: one pointer at a time; a resting palm (non-pen pointer) is ignored once a Pencil has been seen
  const container = $("#boxes");
  const block = e => { if (e.target.closest && e.target.closest(".box") && e.cancelable) e.preventDefault(); };
  ["touchstart", "touchmove"].forEach(t => container.addEventListener(t, block, { passive: false }));
  let active = null;
  const lastTap = { k: -1, t: 0 };
  const ptIn = (e, cv) => { const r = cv.getBoundingClientRect(), f = size / r.width; return { x: (e.clientX - r.left) * f, y: (e.clientY - r.top) * f, w: widthFor(e) }; };
  container.addEventListener("pointerdown", e => {
    if (st.done) return;
    if (e.pointerType === "pen" && !P.settings.sawPencil) { P.settings.sawPencil = true; save(); }
    const box = e.target.closest(".box"); if (!box) return;
    if (e.pointerType === "touch" && pencilOnly()) {
      const k = +box.dataset.k, now = Date.now();
      if (lastTap.k === k && now - lastTap.t < 350) { clearBox(k); lastTap.t = 0; } else { lastTap.k = k; lastTap.t = now; }
      return;
    }
    if (active) {
      if (e.pointerType !== "pen" || active.type === "pen") return;
      st.ink[active.k].pop(); st.order.pop(); redraw(active.k); active = null; // a pen takes over from an accidental touch
    }
    e.preventDefault();
    const k = +box.dataset.k, cv = canvases[k];
    try { container.setPointerCapture(e.pointerId); } catch (_) {}
    const stroke = [ptIn(e, cv)];
    st.ink[k].push(stroke); st.order.push(k);
    active = { id: e.pointerId, type: e.pointerType, k, cv, stroke };
    redraw(k);
    $("#fb").textContent = "";
  });
  container.addEventListener("pointermove", e => {
    if (!active || e.pointerId !== active.id) return;
    e.preventDefault();
    const ctx = active.cv.getContext("2d");
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    for (const ev of (evs.length ? evs : [e])) {
      const p = ptIn(ev, active.cv), prev = active.stroke[active.stroke.length - 1];
      if (Math.abs(p.x - prev.x) + Math.abs(p.y - prev.y) < 0.8) continue;
      p.w = prev.w * 0.6 + p.w * 0.4; // smooth width changes
      active.stroke.push(p);
      drawSeg(ctx, prev, p, C.ink);
    }
  });
  const end = e => {
    if (!active || e.pointerId !== active.id) return;
    if (tr && active.k === boxes.length - 1) setCount(boxes.length + 1); // writing in the last box opens the next one
    active = null;
  };
  container.addEventListener("pointerup", end);
  container.addEventListener("pointercancel", end);

  $("#undoBtn").onclick = () => { if (st.done || !st.order.length) return; const k = st.order.pop(); st.ink[k].pop(); redraw(k); };
  // Clear empties the box written in most recently; a finger double-tap empties the tapped box
  const clearBox = k => { if (st.done || k == null || k < 0) return; st.ink[k].length = 0; st.order = st.order.filter(x => x !== k); redraw(k); };
  st.clearBox = clearBox;
  $("#clearBtn").onclick = () => clearBox(st.order[st.order.length - 1]);
  $("#hintBtn").onclick = () => {
    if (st.done) return;
    st.hints++;
    st.writers.forEach(wr => wr.showOutline());
    if (!tracing) setTimeout(() => st.writers.forEach(wr => wr.hideOutline()), 1200);
  };
  // the accepted answers that fit this many boxes; in translation 你 and 您 count as the same,
  // except when the note asks for polite speech, and 你们 never becomes 您们
  const swap = tr && !/polite/.test(w.note || "");
  const answersFor = m => [...new Set([w.t, ...(w.alts || [])].filter(a => [...a].length === m)
    .flatMap(a => swap ? [a, a.replace(/您/g, "你"), a.replace(/你(?!们)/g, "您")] : [a]))];
  const toChar = p => { const scale = (size - 2 * pad) / 1024; return { x: (p.x - pad) / scale, y: (size - 124 * scale - pad - p.y) / scale }; };
  // marks the ink against every accepted answer and keeps the one it matches best;
  // answers share most characters, so each box is marked once per distinct character (99 calls → 13 at worst)
  const markInk = () => {
    const mode = markingMode(), ink = st.ink.map(strokes => strokes.map(stroke => stroke.map(toChar))), seen = new Map();
    // an empty box is simply "not written", so the stroke matcher never sees an empty attempt
    const markBox = (k, c) => seen.get(k + c) || seen.set(k + c, ink[k].length ? Mark.character(ink[k], STROKES[c], mode) : { marks: [], good: 0, expected: STROKES[c].medians.length, drawn: 0, correct: false }).get(k + c);
    let best = null;
    for (const a of answersFor(st.ink.length)) {
      const marks = [...a].map((c, k) => markBox(k, c)), good = marks.reduce((x, m) => x + m.good, 0);
      if (!best || good > best.good) best = { a, marks, good };
    }
    st.answer = best.a; st.marks = best.marks;
  };
  const noFit = () => tr && !answersFor(boxes.length).length;
  // empty boxes after the last one written in don't count (they're dropped, keeping at least one)
  const trim = () => { let u = st.ink.length; while (u > 1 && !st.ink[u - 1].length) u--; setCount(u); };
  // seeing the pinyin counts as a hint, like the outline
  if (dict || tr) $("#pyBtn").onclick = () => {
    if (st.done || !$("#py").hidden) return;
    st.hints++; $("#py").hidden = false; $("#pyBtn").disabled = true;
  };
  $("#revealBtn").onclick = () => {
    if (st.done) return;
    if (tr) { trim(); if (noFit() || !st.order.length) setCount([...w.t].length); } // nothing that fits: show the main answer in its own number of boxes
    st.revealed = true; check(true);
  };
  $("#checkBtn").onclick = () => {
    if (st.done) return;
    if (tr) trim();
    const m = st.ink.length;
    // Write and 听写 can be checked with some boxes empty (a half-remembered word is still worth marking);
    // a translation needs every box it is checked with
    const empty = st.ink.findIndex(a => !a.length);
    if (empty >= 0 && (tr || st.ink.every(a => !a.length))) {
      $("#fb").innerHTML = `<span class="pill warn">${m > 1 && tr ? `Box ${empty + 1} is still empty` : "Write something first"}</span>`;
      return;
    }
    if (noFit()) { $("#fb").innerHTML = `<span class="pill warn">No accepted answer has ${m} character${m === 1 ? "" : "s"}. Check the number of boxes.</span>`; return; }
    check(false);
  };

  function check(revealed) {
    st.done = true;
    markInk();
    canvases.forEach((_, k) => redraw(k));
    // the boxes show the same accepted answer as the reference row below (in translation it can differ from the main one)
    if (revealed) canvases.forEach(cv => { cv.style.opacity = ".3"; }); // your strokes fade so the shown answer reads clearly
    if (revealed) [...st.answer].forEach((c, k) => {
      const wr = st.writers[k];
      if (!wr) st.writers[k] = writerFor(k, c, true);
      else if (c === [...w.t][k]) wr.showCharacter();
      else wr.setCharacter(c).then(() => wr.showCharacter());
    });
    if (dict || tr) $("#py").hidden = false;
    if (dict) $("#hint").hidden = false;
    const allCorrect = st.marks.every(m => m.correct);
    const strokesOk = st.marks.reduce((a, m) => a + m.good, 0), strokesExp = st.marks.reduce((a, m) => a + Math.max(m.expected, m.drawn), 0);
    let result;
    if (revealed) result = "miss";
    else if (allCorrect && !st.hints) result = "good";
    else if (allCorrect || strokesOk / strokesExp >= 0.75) result = "close";
    else result = "miss";
    const graded = !tracing && !drill && !again, store = tr ? P.tr : P.w;
    const before = graded && store[w.id] ? { ...store[w.id] } : null; // kept so "It was right" can undo this grade
    const record = r => {
      if (tr) { const x = P.tr[w.id] = P.tr[w.id] || { n: 0, c: 0 }; x.n++; if (r !== "miss") x.c++; x.last = Date.now(); }
      else grade(w.id, r);
    };
    const res = { w, result, hints: st.hints, revealed, bad: strokesExp - strokesOk };
    // your own writing, with its stroke marks, for the copybook page at the end of the round
    const snap = () => { res.ink = st.ink.some(a => a.length) ? canvases.map(cv => cv.toDataURL()) : null; };
    snap();
    if (graded) { record(result); s.results.push(res); save(); }

    // model characters under each box, with a note on what went wrong; bigger under big iPad boxes
    const ms = size >= 200 ? 88 : 64;
    $("#boxes").style.setProperty("--mw", ms + "px");
    boxes.forEach((b, k) => {
      const m = st.marks[k], col = b.parentElement, note = col.querySelector(".mnote");
      if (!revealed) b.classList.add(m.correct ? "done" : "wrongbox"); // a shown answer is a study aid, not a mistake
      col.querySelector(".model").hidden = revealed; // a shown answer is already in the boxes; no second copy underneath
      st.modelFor = (k, ms) => { $("#mw" + k).innerHTML = ""; st.models[k] = HanziWriter.create("mw" + k, [...st.answer][k], { width: ms, height: ms, padding: 3, strokeColor: C.ink, renderer: "svg", charDataLoader: loader, strokeAnimationSpeed: 1.4, delayBetweenStrokes: 150 }); };
      st.modelFor(k, ms); st.ms = ms;
      const order = m.marks.filter(x => x === "order").length, back = m.marks.filter(x => x === "backwards").length;
      const msgs = [];
      if (m.correct) msgs.push("All strokes right");
      else {
        if (m.drawn !== m.expected) msgs.push(`${m.drawn} stroke${m.drawn === 1 ? "" : "s"}, should be ${m.expected}`);
        if (order) msgs.push(`${order} out of order`);
        if (back) msgs.push(`${back} written backwards`);
        const wrong = m.marks.filter(x => x === "wrong" || x === "extra").length;
        if (wrong) msgs.push(`${wrong} wrong shape or place`);
        if (!msgs.length) msgs.push(`${m.good} of ${m.expected} strokes right`);
      }
      note.textContent = revealed ? "" : m.drawn ? msgs.join(" · ") : "Not written"; // a shown answer is for studying, so the attempt is not graded
      // a box far from the character (a word not known yet) gets a quiet note; red is for a real attempt that went wrong
      note.className = "mnote " + (m.correct ? "good" : Math.abs(m.drawn - m.expected) > 2 ? "" : "bad");
    });

    const label = tracing ? (allCorrect ? "Traced correctly" : "Check the coloured strokes, then try from memory") : revealed ? "Answer shown" : again ? (allCorrect ? "Correct this time" : "Still some red strokes") : drill ? (allCorrect ? "Correct" : "Not quite, check the coloured strokes") : { good: "Correct", close: allCorrect ? `Correct, with ${st.hints} hint${st.hints === 1 ? "" : "s"}` : "Nearly, check the red strokes", miss: "Not quite, this one comes back soon" }[result];
    const cls = revealed ? "shown" : { good: "good", close: "warn", miss: "bad" }[result];
    // translation names the answer it marked against; the others it accepts are listed after it
    const shown = tr && st.answer !== w.t ? st.answer : w.d;
    const others = tr ? [w.d, ...w.altD].filter(a => hanOnly(a) !== st.answer) : [];
    // the verdict and its overrule ride in the bottom dock with Next, so they're on screen however tall the card is;
    // the longer notes (other accepted answers, the colour key) sit under the boxes
    $("#fb").innerHTML = `<div class="verdict"><span class="pill ${cls}${tr ? " long" : ""}"><span class="han">${esc(shown)}</span>${esc(label)}</span>` +
      (graded && !allCorrect && !revealed ? `<button class="btn small" id="overrideBtn" type="button">It was right</button>` : "") + `</div>`;
    $("#fbx").innerHTML = (others.length ? `<p class="note legend">Also accepted: <span class="han-inline">${others.map(esc).join("　")}</span></p>` : "") +
      (!st.marks.some(m => m.marks.some(x => x === "order" || x === "backwards")) ? "" /* the key is for amber; red speaks for itself */ : `<p class="note legend key"><b class="lg-warn">Amber</b> strokes are out of order or backwards. <b class="lg-bad">Red</b> strokes are the wrong shape or in the wrong place.</p>`);
    const say = () => speak(tr ? shown : w.t);
    say();
    $("#tools").hidden = true;
    if (tr) $(".stepper").hidden = true; // the count is settled once marked
    $("#ctl").classList.add("after"); // still pinned, so Next stays on screen however tall the marked card is
    $("#ctl").innerHTML = `
      <button class="btn" id="animBtn" type="button">Stroke order</button>
      ${dict ? "" : `<button class="btn" id="hearBtn2" type="button">Hear it</button>`}
      ${drill ? `<button class="btn" id="drillNext" type="button">${s.i + 1 < s.words.length ? "Next word" : "Finish"}</button>` : `<button class="btn" id="againBtn" type="button">Write again</button>`}
      <button class="btn primary" id="nextBtn" type="button">${nextLabel}</button>`;
    if ($("#hearBtn2")) $("#hearBtn2").onclick = say; // 听写 keeps its own Play again above
    // the marker can be wrong about good handwriting: put the record back as it was, then grade it as right
    // once overruled the strokes go back to plain ink and the notes clear; Undo puts the marker's verdict back
    if ($("#overrideBtn")) {
      const marked = { rec: store[w.id] ? { ...store[w.id] } : null, res: { ...res }, marks: st.marks, pill: $("#fb .pill").outerHTML };
      const notes = boxes.map(b => b.parentElement.querySelector(".mnote"));
      const noteWas = notes.map(x => [x.textContent, x.className]);
      const overrule = () => {
        if (before) store[w.id] = { ...before }; else delete store[w.id];
        Object.assign(res, { result: st.hints ? "close" : "good", bad: 0, overridden: true });
        record(res.result); save();
        st.marks = null; canvases.forEach((_, k) => redraw(k)); snap();
        boxes.forEach(b => { b.classList.remove("wrongbox"); b.classList.add("done"); });
        notes.forEach(x => { x.textContent = ""; });
        $("#fb .pill").outerHTML = `<span class="pill good"><span class="han">${esc(shown)}</span>Marked correct by you</span>`;
        if ($("#fbx .key")) $("#fbx .key").hidden = true;
        $("#overrideBtn").textContent = "Undo"; $("#overrideBtn").onclick = undo;
      };
      const undo = () => {
        if (marked.rec) store[w.id] = { ...marked.rec }; else delete store[w.id];
        for (const k in res) delete res[k];
        Object.assign(res, marked.res); save();
        st.marks = marked.marks; canvases.forEach((_, k) => redraw(k)); snap();
        boxes.forEach((b, k) => { b.classList.remove("done"); b.classList.add(st.marks[k].correct ? "done" : "wrongbox"); });
        notes.forEach((x, k) => { [x.textContent, x.className] = noteWas[k]; });
        $("#fb .pill").outerHTML = marked.pill;
        if ($("#fbx .key")) $("#fbx .key").hidden = false;
        $("#overrideBtn").textContent = "It was right"; $("#overrideBtn").onclick = overrule;
      };
      $("#overrideBtn").onclick = overrule;
    }
    if (drill) $("#drillNext").onclick = () => { s.reps = 0; s.i++; if (s.i < s.words.length) renderCard(); else renderPicker(s.lesson); };
    // plays in the small model under each box, or in the box itself where the answer was shown there
    $("#animBtn").onclick = async () => { for (const [k, m] of st.models.entries()) await (boxes[k].parentElement.querySelector(".model").hidden && st.writers[k] ? st.writers[k] : m).animateCharacter(); };
    if (!drill) $("#againBtn").onclick = () => practiseAgain();
    $("#nextBtn").onclick = goNext;
    $("#nextBtn").focus({ preventScroll: true });
    const model0 = boxes[0].parentElement.querySelector(".model"); // the first stroke note clears the dock, however tall the dock is
    // the notes under the boxes (other accepted answers, the colour key) come into view too when there are any
    const clear = $("#fbx").textContent ? $("#fbx") : model0;
    clear.style.scrollMarginBottom = $("#dock").offsetHeight + 16 + "px"; clear.scrollIntoView({ block: "nearest" });
  }

  // extra practice on the same word: a fresh card with the answer hidden again; the first attempt's grade stands
  function practiseAgain() { s.again = true; renderCard(); }
}

/* ---------------- Translation (exercises/translation.json) ---------------- */
let TRANS = {}, trCount = 10;
const hanOnly = s => [...s].filter(c => /[一-鿿]/.test(c)).join("");
// equally good wordings the data doesn't list; each rule is applied to everything the earlier rules made
const PRON = "(我们|你们|他们|她们|我|你|您|他|她)", PLURAL = "(我们|你们|他们|她们)";
const TIME = "((?:今天|明天|昨天|现在|晚上|下午|上午|早上|白天|今年|去年|平时|刚才|星期六|以前|有的时候|常常)+)";
const PEOPLE = "(爸爸|妈妈|太太|孩子|父母亲|老师|朋友|同学|家|老板|家乡|老家|房东|经理)", PLACES = "(大学|学校|公司|系)";
const WORDING_RULES = [
  zh => [zh.replace(/(号码|电话)是什么/g, "$1是多少"), zh.replace(/(号码|电话)是多少/g, "$1是什么")],
  // 很 before an adjective is optional unless the English asks for "very" (then 非常 works too); 很多 and 很少 keep it
  (zh, en) => /\b(very|really|quite)\b/i.test(en) ? [zh.replace(/很/g, "非常"), zh.replace(/非常/g, "很")] : [zh.replace(/很(?![多少])/g, "")],
  // 儿 is optional, and 哪儿/这儿/那儿 have 里 forms
  zh => [zh.replace(/一点儿/g, "一点"), zh.replace(/哪儿/g, "哪里"), zh.replace(/这儿/g, "这里"), zh.replace(/那儿/g, "那里"), zh.replace(/(玩|空|事|花)儿/g, "$1")],
  zh => [zh.replace(/有点儿/g, "有一点儿"), zh.replace(/有点儿/g, "有点")],
  // a time phrase can come before or after the subject
  zh => [zh.replace(new RegExp(`(^|[，。？！])${PRON}${TIME}`, "g"), "$1$3$2"), zh.replace(new RegExp(`(^|[，。？！])${TIME}${PRON}`, "g"), "$1$3$2")],
  // 的 is optional before family, friends and home; before a school or company only after 我们/你们/他们
  zh => [zh.replace(new RegExp(PRON + "的" + PEOPLE, "g"), "$1$2"), zh.replace(new RegExp(PLURAL + "的" + PLACES, "g"), "$1$2"),
    zh.replace(new RegExp(PRON + "(?=" + PEOPLE + "|" + PLACES + ")", "g"), "$1的")],

function rateCard(w, r) {

  s.queue.shift();
  if (!(w.id in s.first)) {
    s.first[w.id] = r;
    // only the first rating of a round moves the review schedule
    grade(w.id, r === "again" ? "miss" : r === "hard" ? "close" : "good");
    if (r === "easy") { const x = P.w[w.id]; x.st = Math.min(x.st + 1, INTERVALS.length - 1); x.due = Date.now() + INTERVALS[x.st] * DAY; }
    save();
  }
  if (r === "again") { s.again++; s.queue.splice(Math.min(3, s.queue.length), 0, w); }
  else s.done++;
  showCard();
}
function cardsDone() {
  const s = session; if (!s) return renderLearn();

  route = "summary";
  const weak = Object.keys(s.first).filter(id => s.first[id] === "again" || s.first[id] === "hard").map(id => WORDS[+id]);
  main.innerHTML = `
  <div class="view">
    <div><div class="eyebrow">Learn · ${esc(s.label)}</div><h2>Flashcards done</h2></div>
    <div class="score"><span class="big">${f.length}</span><span>${f.length === 1 ? "card" : "cards"}: ${count("easy")} easy, ${count("good")} good, ${count("hard")} hard, ${count("again")} again</span></div>
    ${weak.length ? `<p class="note">Still shaky: <span class="han-inline">${weak.map(w => esc(w.d)).join("、")}</span></p>` : ""}
    <div class="settings-row">

      <button class="btn" id="toLearn" type="button">${s.lesson ? "Back to Learn" : "Back to flagged words"}</button>

}

/* Match game */
let matchSide = "english";
function startMatch(lesson) {
  const ws = shuffle(lessonWords(lesson));
  const rounds = [];
  for (let i = 0; i < ws.length; i += 6) rounds.push(ws.slice(i, i + 6));
  if (rounds.length > 1 && rounds[rounds.length - 1].length < 3) rounds[rounds.length - 2].push(...rounds.pop());
  session = { kind: "match", lesson, rounds, r: 0, mistakes: 0, t0: Date.now(), wrongIds: new Set() };
  route = "match";
  showMatch();
}
function showMatch() {
  const s = session, round = s.rounds[s.r];
  const right = shuffle(round), left = shuffle(round);
  const label = w => matchSide === "english" ? esc(w.h) : esc(w.p);
  main.innerHTML = `
  <div class="practice">
    <div class="ptop">
      <button class="iconbtn" id="quit" type="button">End</button>
      <div class="track"><i style="width:${100 * s.r / s.rounds.length}%"></i></div>
      <span class="count">Round ${s.r + 1} / ${s.rounds.length}</span>
    </div>
    <div class="settings-row"><span class="note">Match with</span><div class="seg" id="segSide">
      <button type="button" data-v="english" aria-pressed="${matchSide === "english"}">English</button><button type="button" data-v="pinyin" aria-pressed="${matchSide === "pinyin"}">Pinyin</button>
    </div><span class="note" id="clock"></span></div>
    <div class="match">
      <div class="mcol">${left.map(w => `<button class="tile han-tile" type="button" data-id="${w.id}">${esc(w.d)}</button>`).join("")}</div>
      <div class="mcol">${right.map(w => `<button class="tile" type="button" data-id="${w.id}">${label(w)}</button>`).join("")}</div>
    </div>
  </div>`;
  $("#quit").onclick = () => matchDone(true);
  $("#segSide").querySelectorAll("button").forEach(b => b.onclick = () => { matchSide = b.dataset.v; showMatch(); });
  const tick = () => { const el = $("#clock"); if (!el || session !== s) return; el.textContent = fmtTime(Date.now() - s.t0); setTimeout(tick, 500); };
  tick();
  let pick = null, left_ = 0;
  const tiles = [...main.querySelectorAll(".tile")];
  tiles.forEach(t => t.onclick = () => {
    if (t.classList.contains("gone")) return;
    const isLeft = t.classList.contains("han-tile");
    if (!pick || pick.classList.contains("han-tile") === isLeft) {
      if (pick) pick.classList.remove("picked");
      pick = t; t.classList.add("picked");
      if (isLeft) speak(WORDS[+t.dataset.id].t);
      return;
    }
    const a = pick, b = t; pick = null; a.classList.remove("picked");
    if (a.dataset.id === b.dataset.id) {
      a.classList.add("gone"); b.classList.add("gone");
      if (++left_ === round.length) setTimeout(() => { s.r++; if (s.r < s.rounds.length) showMatch(); else matchDone(false); }, 350);
    } else {
      s.mistakes++;
      s.wrongIds.add(+a.dataset.id); s.wrongIds.add(+b.dataset.id);
      [a, b].forEach(x => { x.classList.add("bad"); setTimeout(() => x.classList.remove("bad"), 450); });
    }
  });
}
function fmtTime(ms) { const sec = Math.floor(ms / 1000); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; }
function matchDone(early) {
  const s = session; if (!s) return renderLearn();
  const ms = Date.now() - s.t0, key = "match-" + s.lesson;
  P.best = P.best || {};
  const prev = P.best[key];
  const newBest = !early && (!prev || ms < prev);
  if (newBest) { P.best[key] = ms; save(); }
  route = "summary";
  const wrong = [...s.wrongIds].map(id => WORDS[id]);
  main.innerHTML = `
  <div class="view">
    <div><div class="eyebrow">Learn · Lesson ${esc(s.lesson)}</div><h2>${early ? "Match game stopped" : "All matched"}</h2></div>
    <div class="score"><span class="big">${fmtTime(ms)}</span><span>${s.mistakes} mistake${s.mistakes === 1 ? "" : "s"}${newBest ? " · new best time" : prev ? ` · best ${fmtTime(prev)}` : ""}</span></div>
    ${wrong.length ? `<p class="note">Mixed up: <span class="han-inline">${uniqueWords(wrong).map(w => esc(w.d)).join("、")}</span></p>` : ""}
    <div class="settings-row"><button class="btn primary" id="again" type="button">Play again</button><button class="btn" id="toLearn" type="button">Back to Learn</button></div>
  </div>`;
  $("#again").onclick = () => startMatch(s.lesson);
  $("#toLearn").onclick = () => renderLearn(s.lesson);
  session = null;
}

/* Tone trainer */
let toneHide = false;
function startTones(lesson) {
  const ws = shuffle(lessonWords(lesson).filter(w => w.tn));

  route = "tones";
  showTone();
}
function showTone() {
  const s = session;

  const w = s.words[s.i], picks = w.tn.map(() => 0);
  main.innerHTML = `
  <div class="practice">
    <div class="ptop">
      <button class="iconbtn" id="quit" type="button">End</button>
      <div class="track"><i style="width:${100 * s.i / s.words.length}%"></i></div>
      <span class="count">${s.i + 1} / ${s.words.length}</span>
    </div>
    <div class="prompt">
      <div class="eyebrow">Which tones do you hear?</div>
      ${toneHide ? `<div class="py">？</div>` : `<div class="fc-han small">${esc(w.d)}</div>`}
      <div class="hint">${esc(w.h)}</div>
    </div>
    <div class="settings-row" style="justify-content:center">
      <button class="btn" id="tPlay" type="button">Play</button><button class="btn" id="tSlow" type="button">Play slowly</button>
      ${zhVoice ? "" : `<p class="note"><b>No Mandarin voice found</b>, so nothing will play. On iPad, add one in Settings > Accessibility > Spoken Content > Voices > Chinese (China).</p>`}
      <button class="btn" id="tHide" type="button">${toneHide ? "Show characters" : "Hide characters"}</button>
    </div>
    <div class="tones">${w.tn.map((t, k) => `
      <div class="tcol" data-k="${k}" role="group" aria-label="Tone of syllable ${k + 1}"><div class="han">${toneHide ? "·" : esc(w.t[k])}</div>
        ${[1, 2, 3, 4, 5].map(n => `<button class="tbtn" type="button" data-n="${n}">${TONE_NAMES[n]}</button>`).join("")}
      </div>`).join("")}</div>
    <div class="feedback" id="fb"></div>
    <div class="controls" id="ctl"><button class="btn primary" id="tCheck" type="button" disabled>Check</button></div>
  </div>`;
  speak(w.t, 0.8);
  $("#quit").onclick = () => tonesDone();
  $("#tPlay").onclick = () => speak(w.t, 0.8);
  $("#tSlow").onclick = () => speak(w.t, 0.5);
  $("#tHide").onclick = () => { toneHide = !toneHide; showTone(); };
  main.querySelectorAll(".tcol").forEach(col => col.querySelectorAll(".tbtn").forEach(b => b.onclick = () => {
    if (s.checked) return;
    picks[+col.dataset.k] = +b.dataset.n;

  }));

      const n = +b.dataset.n;

    }));
    const sandhi = /[一不]/.test(w.t) ? " Note: 一 and 不 change tone in speech; the book's citation tone is marked here." : (w.tn.filter((t, k) => t === 3 && w.tn[k + 1] === 3).length ? " Note: two 3rd tones in a row: the first is spoken like a 2nd tone." : "");
    $("#fb").innerHTML = `<span class="pill ${ok ? "good" : "bad"}">${ok ? "Right" : "Not quite"}<span class="han">${esc(w.d)}</span>${esc(w.p)}</span>${sandhi ? `<p class="note legend">${esc(sandhi.trim())}</p>` : ""}`;
    speak(w.t, 0.8);
    $("#ctl").innerHTML = `<button class="btn primary" id="tNext" type="button">${s.i + 1 < s.words.length ? "Next" : "See results"}</button>`;
    $("#tNext").onclick = () => { s.i++; showTone(); };
  };
}
function tonesDone() {
  const s = session; if (!s) return renderLearn();

  main.innerHTML = `
  <div class="view">
    <div><div class="eyebrow">Learn · Lesson ${esc(s.lesson)}</div><h2>Tone trainer</h2></div>

    ${s.missed.length ? `<div class="results">${uniqueWords(s.missed).map(w => `<div class="row"><span class="han">${esc(w.d)}</span><span>${esc(w.p)}</span><span class="muted">${w.tn.map(t => TONE_NAMES[t]).join(" + ")}</span><button class="btn" type="button" data-say="${esc(w.t)}">Hear it</button></div>`).join("")}</div>` : ""}
    <div class="settings-row">${s.missed.length ? `<button class="btn primary" id="retryT" type="button">Practise the ${s.missed.length} again</button>` : ""}<button class="btn" id="toLearn" type="button">Back to Learn</button></div>

/* ---------------- Lesson texts: reading, listening, grammar (lessons.json) ---------------- */
let TEXTS = {};
// questions are written with the right answer first
const options = q => shuffle(q[1].map((t, k) => ({ t, ok: k === 0 })));
const textLessons = () => LESSONS.filter(l => TEXTS[l]);
// the lesson asked for, or the nearest earlier one that has texts
const textLesson = l => { const ls = textLessons(); return ls.includes(l) ? l : ls.filter(x => lessonIndex(x) <= lessonIndex(l)).pop() || ls[0]; };
const textSelect = (id, cur) => `<div class="field" style="min-width:200px"><label for="${id}" class="lbl">Lesson</label><select id="${id}">${textLessons().map(l => `<option value="${l}"${l === cur ? " selected" : ""}>Lesson ${l}</option>`).join("")}</select></div>`;
function logHist(mode, label, n, good) { P.hist.push({ t: Date.now(), mode, label, n, good }); P.hist = P.hist.slice(-200); save(); }

let READS = {}; // lesson → dialogue and story from exercises/reading.json
// a lesson's passages: the dialogue and story from reading.json, then the short text from lessons.json
const passagesFor = l => [
  ...(READS[l] || []).map(p => ({ id: p.id, name: `${p.kind === "dialogue" ? "Dialogue" : "Story"} · ${p.title.zh}`, title: p.title, lines: p.lines, text: p.text,
    qs: p.questions.map(q => ({ zh: q.zh, py: q.py, en: q.en, opts: options([0, q.options]) })) })),
  ...(TEXTS[l] ? [{ id: l + "-short", name: "Short text", text: TEXTS[l].r[0], qs: TEXTS[l].r[1].map(q => ({ en: q[0], opts: options(q) })) }] : []),
];
// course words in a passage become tappable: longest match first against the vocabulary
let VOCAB = null;
function linkWords(zh) {
  if (!VOCAB) { VOCAB = new Map(); WORDS.forEach(w => { if (dictable(w) && !VOCAB.has(w.t)) VOCAB.set(w.t, w); }); }
  const cs = [...zh];
  let out = "", i = 0;
  while (i < cs.length) {
    let L = Math.min(6, cs.length - i);
    while (L > 0 && !VOCAB.has(cs.slice(i, i + L).join(""))) L--;
    if (L) { const t = cs.slice(i, i + L).join(""); out += `<span class="wd" data-id="${VOCAB.get(t).id}">${esc(t)}</span>`; i += L; }
    else out += esc(cs[i++]);
  }
  return out;
}
// a sentence you tap to show its pinyin and English
const revealLine = (zh, py, en, speaker) => `<button type="button" class="line" aria-expanded="false">${speaker ? `<b class="spk">${esc(speaker)}：</b>` : ""}<span class="zh">${linkWords(zh)}</span><span class="gloss" hidden><span class="lpy">${esc(py)}</span><span class="note">${esc(en)}</span></span></button>`;
// the panel for a tapped word: pinyin, meaning, hear it, flag it
function wordPop(w) {

  if (!pop) { pop = document.createElement("div"); pop.id = "wordPop"; pop.className = "wpop"; pop.setAttribute("role", "dialog"); main.append(pop); }

  // focus moves into the card and back to where it came from when it closes

const paintFlagged = () => main.querySelectorAll(".wd").forEach(sp => sp.classList.toggle("flagged", isFlagged(WORDS[+sp.dataset.id])));
let readListen = false;

  main.innerHTML = `

    <div class="sechead"><div><div class="eyebrow">Grammar · 语法</div><h2>Lesson ${esc(lesson)}</h2></div>${textSelect("gramSel", lesson)}</div>
    ${TEXTS[lesson].g.map(([t, e, ex]) => `<section class="sheet"><h3>${esc(t)}</h3><p class="note">${esc(e)}</p>
      ${ex.map(([zh, en]) => `<div class="gex"><button class="btn" type="button" data-say="${esc(plain(zh))}" aria-label="Hear ${esc(plain(zh))}">Hear</button><div><div class="zh">${esc(plain(zh))}</div><div class="note">${esc(en)}</div></div></div>`).join("")}</section>`).join("")}
    <div class="settings-row"><button class="btn primary" id="gQuiz" type="button">Quiz on lesson ${esc(lesson)}</button><button class="btn" id="back" type="button">Back</button></div>
  </div>`;
  $("#gramSel").onchange = e => renderGrammar(e.target.value);
  main.querySelectorAll("[data-say]").forEach(b => b.onclick = () => speak(b.dataset.say));
  $("#gQuiz").onclick = () => startGrammarQuiz(lesson);
  $("#back").onclick = () => go("home");
  window.scrollTo(0, 0);
}
function startGrammarQuiz(lesson) {
  const pts = TEXTS[lesson].g;
  // gap-fills as written, plus a word-order item from every example of three or more words;
  // an example may list other correct orders after "|"
  const items = shuffle([
    ...pts.flatMap(p => p[3].map(q => ({ kind: "gap", q: q[0], answer: q[1][0], opts: options(q), rule: [p[0], p[1]] }))),
    ...pts.flatMap(p => p[2].filter(([zh]) => zh.split("|")[0].split(" ").length > 2).map(([zh, en]) => {
      const orders = zh.split("|");
      return { kind: "order", words: orders[0].split(" "), accept: orders.map(o => o.replace(/ /g, "")), en, rule: [p[0], p[1]] };
    })),
  ]);
  session = { kind: "grammar", lesson, items, i: 0, right: 0, missed: 0 };
  route = "gquiz";
  showGrammarItem();
}
function showGrammarItem() {
  const s = session;
  if (s.i >= s.items.length) return grammarDone();
  const it = s.items[s.i], gap = it.kind === "gap";
  const pool = gap ? it.opts.map(o => o.t) : shuffle(it.words), built = [];
  let pick = -1, checked = false;
  main.innerHTML = `
  <div class="practice">
    <div class="ptop">
      <button class="iconbtn" id="quit" type="button">End</button>
      <div class="track"><i style="width:${100 * s.i / s.items.length}%"></i></div>
      <span class="count">${s.i + 1} / ${s.items.length}</span>
    </div>
    <div class="prompt">
      <div class="eyebrow">Grammar · Lesson ${esc(s.lesson)} · ${gap ? "fill the gap" : "put the words in order"}</div>
      ${gap ? `<div class="gq">${esc(it.q)}</div>` : `<div class="hint">${esc(it.en)}</div><div class="gq" id="built"></div>`}
    </div>
    <div class="tones" id="opts">${pool.map((t, k) => `<button class="tbtn word" type="button" data-k="${k}">${esc(t)}</button>`).join("")}</div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="controls" id="ctl">${gap ? "" : `<button class="btn" id="gUndo" type="button">Undo</button>`}<button class="btn primary" id="gCheck" type="button" disabled>Check</button></div>
  </div>`;
  $("#quit").onclick = () => grammarDone();
  const btns = [...main.querySelectorAll("#opts .tbtn")];
  const paint = () => {
    if (gap) btns.forEach((b, k) => b.setAttribute("aria-pressed", String(k === pick)));
    else { $("#built").textContent = built.map(k => pool[k]).join(""); btns.forEach((b, k) => b.disabled = built.includes(k)); }
    $("#gCheck").disabled = gap ? pick < 0 : built.length < pool.length;
  };
  btns.forEach((b, k) => b.onclick = () => { if (checked) return; if (gap) pick = k; else built.push(k); paint(); });
  if (!gap) $("#gUndo").onclick = () => { if (!checked) { built.pop(); paint(); } };
  $("#gCheck").onclick = () => {
    checked = true;
    const mine = built.map(k => pool[k]).join("");
    const ok = gap ? it.opts[pick].ok : it.accept.includes(mine);
    const sentence = gap ? it.q.replace("＿", it.answer) : ok ? mine : it.words.join("");
    if (ok) s.right++; else s.missed++;
    if (gap) btns.forEach((b, k) => { if (it.opts[k].ok) b.classList.add("right"); else if (k === pick) b.classList.add("wrong"); });
    // the correct sentence takes the big slot (the eye should remember the right pattern), what you wrote is the small
    // note in the pill, and a miss names its grammar point and rule at reading size
    $(".practice .gq").textContent = sentence;
    $("#fb").innerHTML = ok ? `<span class="pill good">Right</span>`
      : `<span class="pill bad">${gap ? "Not quite" : `Not quite · you wrote <span class="han">${esc(mine)}</span>`}</span>` + /* a gap pick is already marked "yours" on its tile */
        `<p class="rule">${it.rule[1].includes(it.rule[0]) ? esc(it.rule[1]) : `<b>${esc(it.rule[0])}</b>: ${esc(it.rule[1])}`}</p>`;
    speak(sentence.replace(/^.*= /, ""));
    $("#ctl").innerHTML = `<button class="btn" id="gHear" type="button">Hear it</button><button class="btn primary" id="gNext" type="button">${s.i + 1 < s.items.length ? "Next" : "See results"}</button>`;
    $("#gHear").onclick = () => speak(sentence.replace(/^.*= /, ""));
    $("#gNext").onclick = () => { s.i++; showGrammarItem(); };
  };
}
function grammarDone() {
  const s = session; if (!s) return go("home");
  const n = s.right + s.missed;
  if (n) logHist("grammar", "Lesson " + s.lesson, n, s.right);
  route = "summary";
  main.innerHTML = `
  <div class="view">
    <div><div class="eyebrow">Grammar · Lesson ${esc(s.lesson)}</div><h2>Quiz results</h2></div>
    <div class="score"><span class="big">${s.right}/${n}</span><span>right</span></div>
    <div class="settings-row"><button class="btn primary" id="gAgain" type="button">Quiz again</button><button class="btn" id="gBack" type="button">Back to the grammar points</button></div>
  </div>`;
  $("#gAgain").onclick = () => startGrammarQuiz(s.lesson);
  $("#gBack").onclick = () => renderGrammar(s.lesson);
  session = null;
}

/* ---------------- Settings ---------------- */
function renderSettings() {
  const s = P.settings;
  main.innerHTML = `
  <div class="view">
    <div><div class="eyebrow">Settings</div><h2>Writing and progress</h2></div>
    <section class="sheet">
      <div class="field"><span class="lbl">Writing input</span><div class="seg" id="segInput">
        <button type="button" data-v="auto">Automatic</button><button type="button" data-v="pencil">Apple Pencil only</button><button type="button" data-v="any">Pencil or finger</button>
      </div><p class="note">Automatic accepts your finger until you first write with Apple Pencil, then ignores fingers and your palm in the writing boxes. Once fingers are ignored, double-tap a box with your finger to clear it.${s.sawPencil ? " Apple Pencil has been detected." : ""}</p></div>
      <div class="field"><span class="lbl">Marking</span><div class="seg" id="segMark">
        <button type="button" data-v="standard">Standard</button><button type="button" data-v="lenient">Lenient</button><button type="button" data-v="free">Any stroke order</button>
      </div><p class="note">Your writing is marked when you tap Check. Standard checks stroke order and shape. Lenient accepts much looser stroke shapes. Neither minds if the character is big, small or off-centre in the box. Any stroke order checks only that every stroke is there, in the right shape and direction.</p></div>
      <div class="field"><span class="lbl">Audio</span><p class="note" id="voiceNote"></p><div><button class="btn" id="testVoice" type="button">Test voice: 你好，我叫王小明。</button></div></div>
      <div class="field"><span class="lbl">Keyboard</span><p class="note">With a keyboard attached, Enter checks your writing and then moves on, Esc closes a word card, and in flashcards Space flips the card and 1–4 rate it (Again, Hard, Good, Easy).</p></div>
      <div class="field"><span class="lbl">Progress</span><p class="note">${Object.keys(P.w).length} words practised, ${WORDS.filter(w => mastered(w.id)).length} mastered, ${flaggedWords().length} flagged. ${plural(Object.values(P.tr).filter(r => r.c).length, "translation sentence")} right, ${plural(Object.keys(P.rd).length, "reading passage")} done. ${dbRef ? "Progress syncs to every device where you open this page signed in to Claude." : "Progress is saved in this browser only right now."}</p>
        <div class="settings-row"><button class="btn" id="resetBtn" type="button">Reset all progress</button><span class="note" id="resetNote"></span></div></div>
      <div><button class="btn primary" id="done" type="button">Done</button></div>
    </section>
  </div>`;
  const seg = (id, key, cast) => {
    const el = $(id);
    const paint = () => el.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(cast(b.dataset.v) === s[key])));
    el.querySelectorAll("button").forEach(b => b.onclick = () => { s[key] = cast(b.dataset.v); save(); paint(); });
    paint();
  };
  seg("#segInput", "input", String);
  markingMode(); seg("#segMark", "marking", String);
  $("#voiceNote").textContent = zhVoice ? `Using the ${zhVoice.name} voice.` +
    (/premium|enhanced/i.test(zhVoice.name + zhVoice.voiceURI) ? "" : " For a more natural one, download a Premium or Enhanced Chinese (China) voice in Settings > Accessibility > Spoken Content > Voices.") :"No Mandarin voice found yet. On iPad, add one in Settings > Accessibility > Spoken Content > Voices > Chinese (China).";
  $("#testVoice").onclick = () => speak("你好，我叫王小明。");
  let armed = false;
  $("#resetBtn").onclick = () => {
    // armed for 4 s only, like End, so a stray tap minutes later can never erase everything
    if (!armed) { const was = [$("#resetBtn").textContent, $("#resetNote").textContent]; armed = true; $("#resetBtn").textContent = "Tap again to erase everything"; $("#resetNote").textContent = "This cannot be undone."; setTimeout(() => { if (!$("#resetBtn")) return; armed = false; [$("#resetBtn").textContent, $("#resetNote").textContent] = was; }, 4000); return; }
    const keep = P.settings, cur = P.cur; adopt(blank()); P.settings = keep; P.cur = cur; save(); renderSettings();
  };
  $("#done").onclick = closeSettings;
}

/* ---------------- Boot ---------------- */
async function boot() {
  const local = loadLocal(); if (local) adopt(local);
  setSync("", "Connecting");
  connectDb();
  try {
    const [w, s, t, x, rd] = await Promise.all(["words.json", "strokes.json", "lessons.json", "exercises/translation.json", "exercises/reading.json"].map(f => fetch(f).then(r => r.json())));
    WORDS = w; STROKES = s; TEXTS = t; TRANS = Object.fromEntries(x.lessons.map(L => [L.lesson, L.items]));
    READS = Object.fromEntries(rd.lessons.map(L => [L.lesson, L.passages]));
  } catch (e) {
    main.innerHTML = `<div class="loading">The word list did not load. Check your connection and reload the page.</div>`;
    return;
  }
  const num = l => l.split(".").map(Number);
  LESSONS = [...new Set(WORDS.map(w => w.l))].sort((a, b) => { const [a1, a2] = num(a), [b1, b2] = num(b); return a1 - b1 || a2 - b2; });
  LESSONS.forEach(l => byLesson[l] = WORDS.filter(w => w.l === l));
  if (!byLesson[P.cur]) P.cur = "1.1";
  if (typeof HanziWriter === "undefined") {
    main.innerHTML = `<div class="loading">The handwriting engine did not load. Check your connection and reload the page.</div>`;
    return;
  }
  go("home");
}
boot();
})();
</script>

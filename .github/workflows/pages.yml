name: Deploy demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# one deploy at a time: a push right after another waits for it instead of both deploying at once
# (a failed run can't be re-run: the re-run uploads a second artifact and deploy-pages refuses; push again instead)
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # app/index.html is a page body; the build wraps it with the doctype and viewport tags phones need
      - run: sh tools/standalone.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
